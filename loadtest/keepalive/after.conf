# [측정 전용] 변경안 — before.conf 에서 upstream keepalive 와 Connection 헤더만 바꿨다.
# 운영과 다른 점: listen 80(TLS 없음), limit_req 없음, 접근 로그에 upstream 시간 필드 추가.
# keepalive_timeout 은 Tomcat keep-alive(미설정 → connectionTimeout 기본 60s)보다 짧게 둔다.

log_format ka '$msec $status $request_method $uri $request_time '
              '$upstream_connect_time $upstream_response_time $upstream_addr $upstream_status';

upstream ott_backend {
    server ott-app:8090   max_fails=1 fail_timeout=5s;
    server ott-app-2:8090 max_fails=1 fail_timeout=5s;
    keepalive 16;
    keepalive_timeout 30s;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/ka.log ka;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    location /actuator/health {
        proxy_pass http://ott_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/auth/ {
        proxy_pass http://ott_backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://ott_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}


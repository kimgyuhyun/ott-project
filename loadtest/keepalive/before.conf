# [측정 전용] 기준선 — nginx/nginx.prod.ha.conf 의 백엔드 경로를 그대로 옮겼다.
# 운영과 다른 점: listen 80(TLS 없음), limit_req 없음, 접근 로그에 upstream 시간 필드 추가.
# after.conf 와의 차이는 upstream keepalive 와 Connection 헤더뿐이어야 한다(한 번에 하나만 바꾼다).

log_format ka '$msec $status $request_method $uri $request_time '
              '$upstream_connect_time $upstream_response_time $upstream_addr $upstream_status';

upstream ott_backend {
    server ott-app:8090   max_fails=1 fail_timeout=5s;
    server ott-app-2:8090 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/ka.log ka;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    location /actuator/health {
        proxy_pass http://ott_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/auth/ {
        proxy_pass http://ott_backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /api/ {
        proxy_pass http://ott_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

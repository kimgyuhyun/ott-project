# 인증서 최초 발급용 임시 HTTP 스택(opt-in). 갱신은 renew-cert.cmd 가 프로덕션 nginx 를
# 그대로 쓰므로 이 파일은 발급 때만 뜬다.
#
# [SECURITY 2026-08-29] 하드닝 추가. PLATFORM 2절은 "모든 컨테이너"를 대상으로 하는데
# 이 파일은 2026-07-31 전수 적용에서 통째로 빠져 있었다(그 커밋은 prod/monitoring 만 훑었다).
# 짧게 뜨는 스택이라는 것은 예외 사유가 아니다 — 이건 80 번을 인터넷에 직접 여는 컨테이너다.
services:
  nginx-cert:
    image: nginx:alpine
    pull_policy: missing          # 근거는 docker-compose.yml 상단 주석 참고
    container_name: ott-nginx-cert
    logging:                      # 도커 기본은 무제한. base 의 x-logging 은 파일을 넘어오지 않는다.
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      # 0.0.0.0 유지. HTTP-01 챌린지는 Let's Encrypt 가 인터넷에서 이 포트로 직접 들어와야
      # 성립하므로 루프백으로 좁힐 수 없다. PLATFORM 3절이 인터넷에 여는 것을 허용하는
      # 80/443 안이기도 하다. 발급이 끝나면 이 스택을 내리는 것이 잠그는 방법이다.
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.http.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    # capability 는 prod 의 nginx 와 같은 근거다(docker-compose.prod.yml 의 nginx 주석 참고):
    #   NET_BIND_SERVICE — 컨테이너 안에서 80 을 직접 듣는다
    #   SETUID, SETGID   — 마스터가 워커를 nginx 유저로 내린다
    #   CHOWN            — 기동 시 /var/cache/nginx/* 를 워커 유저 소유로 맞춘다
    #   DAC_OVERRIDE     — 그 캐시 경로가 nginx 소유라 root 마스터가 접근하려면 필요
    #
    # [SECURITY 2026-08-30] read_only 추가.
    # 이 컨테이너는 따로 실측하지 않았다 — 발급할 때만 뜨는 스택이라 지금 떠 있지 않고,
    # 80 번을 물어서 프로덕션 nginx 와 충돌하므로 재보겠다고 띄울 수도 없다.
    # 대신 프로덕션 nginx 의 실측(2주 기동분 docker diff)을 그대로 적용한다. 근거:
    #   - 이미지가 같다(nginx:alpine).
    #   - 여기가 쓰는 설정(nginx.prod.http.conf)은 프로덕션 설정의 진부분집합이다.
    #     ACME 웹루트 서빙과 200 응답뿐이고, proxy_cache_path·access_log·pid·*_temp 같은
    #     파일 경로 지시어가 하나도 없다(확인함). 프록시가 없으니 proxy_temp 로 흘릴 일도 없다.
    #   - /run/nginx.pid 와 /var/cache/nginx/*_temp 는 설정과 무관하게 기동 시
    #     ngx_create_paths() 가 만드는 컴파일 기본값이라 여기서도 똑같이 필요하다.
    # 캐시 크기만 프로덕션(64m)보다 작게 잡는다 — 프록시 버퍼 스필이 없어서 쓸 일이 없다.
    # /var/www/certbot 은 볼륨이라 read_only 와 무관하게 계속 쓸 수 있다(certbot 챌린지 파일).
    read_only: true
    tmpfs:
      - /run:noexec,nosuid,nodev,size=4m
      - /var/cache/nginx:noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # prod nginx 와 같은 값. 하는 일은 더 적지만(TLS 종료가 없다) 따로 잴 이유가 없다.
    mem_limit: 256m
    cpus: 1.5
    networks:
      - default

volumes:
  certbot-etc:
    external: true
    name: certbot-etc
  certbot-webroot:
    external: true
    name: certbot-webroot

networks:
  default:
    driver: bridge



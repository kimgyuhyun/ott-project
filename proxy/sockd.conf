# ============================================================================
# ott-smtp-proxy — SOCKS5, the backend's only non-HTTP outbound destination.
# ----------------------------------------------------------------------------
# Mail submission is the one thing squid cannot carry (it is not HTTP). SOCKS5 keeps
# the destination HOSTNAME end to end, so STARTTLS certificate verification in the
# backend is unchanged — a TCP relay would break it.
#
# external: 이 컨테이너는 망 두 개에 붙어 있고, dante 는 나가는 주소를 하나로 지정해야
# 한다(와일드카드 0.0.0.0 은 "cannot be a wildcard address" 로 거부된다 — 실측).
#
# 인터페이스 이름을 쓰지 않는 이유(2026-08-08 실측): 예전엔 eth0 이라고 적고 compose 의
# 부착 우선순위(priority)로 eth0 이 항상 인터넷 망이 되게 맞췄는데, 컨테이너를 다시 만들면
# 그 짝이 깨졌다. 증상이 지독하다 — sockd 는 "running" 을 찍고 1080 도 정상적으로 열려 있는데
# (커널이 accept 한다), 세션마다 나가는 connect 가 매달려서 죽지도 로그를 남기지도 않는다.
# 같은 망의 nginx 는 같은 시각에 smtp.naver.com:587 에서 220 배너를 정상 수신했다. 즉 망도
# DNS 도 멀쩡하고 오직 이 바인딩만 틀렸던 것이다.
#
# 그래서 이름 대신 고정 IP 를 적는다. docker-compose.netlock.yml 이 이 컨테이너에게
# smtpout 망(전용, 이 컨테이너 혼자 쓴다)의 172.30.0.10 을 고정 할당한다. 이러면 인터페이스가
# eth0 이든 eth1 이든 상관없다. 두 값은 반드시 같이 바뀌어야 한다.
# ============================================================================
internal: 0.0.0.0 port = 1080
external: 172.30.0.10
socksmethod: none
clientmethod: none
user.unprivileged: sockd
logoutput: stdout

client pass { from: 0.0.0.0/0 to: 0.0.0.0/0 }
socks pass  { from: 0.0.0.0/0 to: smtp.naver.com port = 587
              command: connect
              protocol: tcp }
socks block { from: 0.0.0.0/0 to: 0.0.0.0/0 }

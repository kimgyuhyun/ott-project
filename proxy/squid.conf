# ============================================================================
# ott-egress-proxy — HTTP/HTTPS forward proxy, default-deny destination allow-list.
# ----------------------------------------------------------------------------
# The backend no longer sits on the egress network, so every outbound HTTP call it
# makes arrives here. Anything not named below cannot leave.
#
# The list is the set of hosts the backend actually connects to (payment gateway,
# the three OAuth providers' token/user-info endpoints, the bot-defence verifier,
# and the two content APIs). Hosts that only appear as browser redirect targets
# are deliberately absent — the backend never opens a socket to them.
#
# 절대 넣지 말 것: ssl_bump / SslBump. HTTPS is judged by the plaintext host in the
# CONNECT line, so TLS interception buys nothing and would put a MITM CA in the path.
# ============================================================================
http_port 3128
visible_hostname ott-egress-proxy

acl allowed_dst dstdomain api.iamport.kr oauth2.googleapis.com www.googleapis.com kauth.kakao.com kapi.kakao.com nid.naver.com openapi.naver.com challenges.cloudflare.com api.themoviedb.org api.jikan.moe
acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

# 순서를 바꾸지 말 것. deny 들이 먼저 오고, allow 는 허용 목록에만 걸리고,
# 마지막 deny all 이 나머지 전부를 막는다.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

cache deny all
# cache_mem 은 캐시를 꺼도 공유메모리 세그먼트를 잡는다. 컨테이너 기본 /dev/shm 은
# 64MB 라 기본값(256MB)이면 기동에 실패한다.
cache_mem 8 MB
pid_filename none
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr

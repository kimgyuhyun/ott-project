name: CD

# ============================================================================
# 보안 재설계 (2026-06-24, XMRig 재감염 대응)
# ----------------------------------------------------------------------------
# CI(ci.yml)가 Trivy 스캔을 통과시킨 뒤 ghcr.io 비공개 레지스트리로 push 한 이미지를,
# self-hosted 러너가 digest 로 pull → egress 차단 보안 스택(docker-compose.netlock.yml)
# 으로 배포 → 백엔드 헬스 + 프론트엔드 egress 차단을 검증(둘 중 하나라도 실패하면 배포 실패).
#   * 인증: GITHUB_TOKEN(단기). 장기 자격증명 불필요.
#   * 이미지가 혹시 오염돼도 frontend는 egress가 없어 드로퍼/채굴 불가(다층 방어).
#
# digest 가 어디서 오는가 (2026-09-02)
#   CI 가 push 직후 레지스트리 digest 를 캡처해 image-digest-<이미지명> 아티팩트로 올린다.
#   CD 는 그 아티팩트를 받아 `ghcr.io/<owner>/<name>@sha256:...` 로 pull 한다. 태그를
#   조립하지도, 태그를 digest 로 해석하지도 않는다.
#   예전에는 CD 가 commit-sha 태그로 pull 한 뒤 docker inspect 로 digest 를 뽑아 "고정"
#   했다. 그 방식이 막는 것은 pull 이후 구간(롤링 교체 중 태그 스왑)뿐이고, CI 종료와
#   CD 의 pull 사이에 같은 태그가 덮어써지면 그 악성 이미지의 digest 를 그대로 고정해
#   배포했다. 지금은 CI 가 스캔한 그 바이트가 그대로 배포된다.
#   workflow_run 이벤트는 잡 output 을 나르지 않아서 아티팩트가 유일한 전달 수단이다.
# ============================================================================
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: '이미지 digest 를 가져올 CI 실행 ID(비우면 main 의 최근 성공 CI 를 쓴다). 과거 릴리스로 되돌릴 때만 채운다.'
        required: false
        type: string

permissions:
  contents: read
  packages: read          # ghcr pull (GITHUB_TOKEN)
  actions: read           # 다른 워크플로 실행(CI)의 아티팩트 조회·다운로드

jobs:
  deploy:
    runs-on: self-hosted
    # 두 경로 모두 main 으로 제한한다.
    # dispatch 분기에 ref 조건이 없으면 임의 브랜치를 골라 Run workflow 하는 것만으로
    # 그 브랜치의 cd.yml 이 self-hosted 러너에서 실행돼 프로덕션에 배포된다.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # CI와 동일하게 공식 액션으로 ghcr 로그인(러너에 자격증명 저장).
      # 수동 docker login --password-stdin은 Windows PowerShell 파이프에서 토큰 전달이
      # 불안정해 'denied'가 발생할 수 있어 사용하지 않는다.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 어느 CI 실행의 digest 를 쓸지 먼저 정한다.
      #   자동(workflow_run)   : 방금 끝난 그 실행.
      #   수동 + ci_run_id 지정: 그 실행. 과거 릴리스로 되돌릴 때의 경로라 커밋 일치를 요구하지 않는다.
      #   수동 + 미지정        : main 의 가장 최근 성공한 CI push 실행. 그 실행의 커밋이 지금
      #                          체크아웃된 HEAD 와 다르면 실패시킨다.
      # 태그 폴백은 두지 않는다. 남기면 수동 배포 한 번으로 태그 해석 구간이 다시 열린다.
      - name: Resolve the CI run that published the image digests
        id: cirun
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Set-Location $env:GITHUB_WORKSPACE

          $runId = $env:EVENT_RUN_ID
          $expectedCommit = $env:EVENT_HEAD_SHA

          if (-not $runId) {
            if ($env:INPUT_RUN_ID) {
              $runId = $env:INPUT_RUN_ID.Trim()
              $expectedCommit = ''
              Write-Host "using the CI run given as input: $runId (commit match not enforced)"
            } else {
              $head = (git rev-parse HEAD).Trim()
              $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" +
                     "?branch=main&status=success&event=push&per_page=1"
              $resp = Invoke-RestMethod -Uri $uri -Headers @{
                Authorization          = "Bearer $env:GH_TOKEN"
                Accept                 = 'application/vnd.github+json'
                'X-GitHub-Api-Version' = '2022-11-28'
              }
              if (@($resp.workflow_runs).Count -lt 1) { throw 'no successful CI run on main - nothing to deploy' }
              $latest = @($resp.workflow_runs)[0]
              if ($latest.head_sha -ne $head) {
                throw "the latest successful CI run is for commit $($latest.head_sha) but HEAD is $head - wait for CI, or pass ci_run_id"
              }
              $runId = "$($latest.id)"
              $expectedCommit = $latest.head_sha
              Write-Host "resolved the latest successful CI run on main: $runId"
            }
          }

          if (-not $runId) { throw 'could not determine which CI run to take the image digests from' }
          "run_id=$runId"                   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "expected_commit=$expectedCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # merge-multiple 로 4개 아티팩트(backend/frontend/프록시 2개)를 ci-digests\ 한 폴더에 모은다.
      # proxies 는 matrix 잡이라 아티팩트 이름에 이미지명이 들어가 있다(ci.yml 참고).
      - name: Download the image digests published by that CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.cirun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: image-digest-*
          merge-multiple: true
          path: ci-digests

      - name: Deploy (ghcr digest-pinned + egress-locked secure stack)
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          EXPECTED_COMMIT: ${{ steps.cirun.outputs.expected_commit }}
          OWNER: ${{ github.repository_owner }}
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ProgressPreference = 'SilentlyContinue'
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host '=== CD START (ghcr digest) ==='

          $owner = $env:OWNER.ToLower()

          # CI 가 push 직후 캡처한 digest 를 읽는다. 태그를 조립하지 않는다 - 조립하면
          # 태그→digest 해석이 이 시점으로 돌아와, CI 종료와 여기 사이에 태그가 덮어써졌을 때
          # 그 이미지를 배포하게 된다.
          # 파일 한 줄 형식: "<커밋SHA> ghcr.io/<owner>/<이미지명>@sha256:<64자리>"
          function Read-PinnedImage([string]$name) {
            $path = Join-Path $PWD "ci-digests\$name.txt"
            if (-not (Test-Path $path)) { throw "digest file missing: $path (CI published no image-digest-$name)" }
            $parts = @(((Get-Content $path -Raw).Trim()) -split '\s+')
            if ($parts.Count -ne 2) { throw "malformed digest file: $path" }
            $repo = "ghcr.io/$owner/$name"
            if ($parts[1] -cnotmatch ('^' + [regex]::Escape($repo) + '@sha256:[0-9a-f]{64}$')) {
              throw "unexpected image ref for ${name}: $($parts[1])"
            }
            return [pscustomobject]@{ Commit = $parts[0]; Ref = $parts[1] }
          }

          $pinned = [ordered]@{}
          foreach ($n in 'ott-backend', 'ott-frontend', 'ott-egress-proxy', 'ott-smtp-proxy') {
            $pinned[$n] = Read-PinnedImage $n
          }

          # 이미지 4개가 같은 커밋에서 나왔는지 확인한다. 섞이면 무엇이 돌고 있는지 특정할 수 없다.
          $commits = @($pinned.Values | ForEach-Object { $_.Commit } | Sort-Object -Unique)
          if ($commits.Count -ne 1) { throw "image digests come from different commits: $($commits -join ', ')" }
          $sha = $commits[0]

          # 자동 배포와 자동 해석 경로에서는 배포 대상 커밋이 정해져 있다.
          # ci_run_id 를 손으로 넣은 롤백 경로에서만 비어 있다.
          $expected = $env:EXPECTED_COMMIT
          if ($expected -and $expected -ne $sha) { throw "digests are from commit $sha but this run targets $expected" }
          if (-not $expected) { Write-Host "WARNING: deploying images built from $sha, which may differ from the checked-out tree" }

          $appImage   = $pinned['ott-backend'].Ref
          $frontImage = $pinned['ott-frontend'].Ref
          $squidImage = $pinned['ott-egress-proxy'].Ref
          $sockdImage = $pinned['ott-smtp-proxy'].Ref
          Write-Host "commit=$sha"
          Write-Host "pinned backend : $appImage"
          Write-Host "pinned frontend: $frontImage"
          Write-Host "pinned proxies : $squidImage / $sockdImage"

          # --- 1) DB 백업 (age 암호화, 실패해도 진행) ---
          # 평문 .sql을 backups\에 남기지 않는다: 덤프는 TEMP에 뜨고 즉시 암호화한 뒤
          # finally에서 원본을 지운다. 공개키는 db-backup.ps1과 동일하므로 복구는
          # 같은 age 개인키(Bitwarden "ott key")로 된다.
          # age를 못 찾거나 암호화가 실패하면 백업 없이 배포를 계속한다 - 평문을 남기는
          # 것보다 이 배포의 롤백 지점을 포기하는 쪽이 낫다(R2 야간 백업은 별도로 돈다).
          $agePub = 'age1nzkslmrgdcec2a3v45ttydmzptfmnrt6774qp3we933csmd9a5rqlsa2zc'
          $tmpSql = $null
          try {
            $backupDir = 'C:\solo-project\backups'
            if (-not (Test-Path $backupDir)) { New-Item -ItemType Directory -Path $backupDir | Out-Null }
            # sops와 같은 이유(self-hosted 러너가 사용자 PATH를 못 물려받음)로 고정 경로 폴백.
            $ageCmd = Get-Command age -ErrorAction SilentlyContinue
            $ageExe = if ($ageCmd) { $ageCmd.Source } else { 'C:\solo-project\tools\age.exe' }
            if (-not (Test-Path $ageExe)) { throw "age not found (PATH or $ageExe)" }
            $stamp  = Get-Date -Format 'yyyyMMdd_HHmmss'
            $tmpSql = Join-Path $env:TEMP ("db_{0}.sql" -f $stamp)
            $bf     = Join-Path $backupDir ("db_{0}.sql.age" -f $stamp)
            docker exec ott-postgres pg_dump -U root ott_project_db | Out-File -FilePath $tmpSql -Encoding UTF8
            if (-not (Test-Path $tmpSql) -or (Get-Item $tmpSql).Length -eq 0) { throw 'pg_dump produced empty file' }
            & $ageExe -r $agePub -o $bf $tmpSql
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bf)) { throw "age encryption failed (exit $LASTEXITCODE)" }
            Write-Host "DB backup -> $bf (age)"
            Get-ChildItem $backupDir -Filter 'db_*.sql.age' | Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-7) } | ForEach-Object { Remove-Item $_.FullName -Force }
          } catch { Write-Host "DB backup skipped: $($_.Exception.Message)" }
          finally { if ($tmpSql -and (Test-Path $tmpSql)) { Remove-Item $tmpSql -Force -ErrorAction SilentlyContinue } }

          # --- 2) .env 생성 (SOPS+age: 커밋된 .env.enc 복호화. 진짜 값은 .env.enc 한 곳에만) ---
          # self-hosted 러너는 사용자 PATH를 못 물려받아 'sops'를 못 찾을 수 있으므로,
          # PATH에 있으면 그걸 쓰고 없으면 고정 경로(C:\solo-project\tools\sops.exe)로 폴백한다.
          if (-not $env:AGE_KEY) { throw 'AGE_KEY secret missing' }
          $sopsCmd = Get-Command sops -ErrorAction SilentlyContinue
          $sopsExe = if ($sopsCmd) { $sopsCmd.Source } else { 'C:\solo-project\tools\sops.exe' }
          if (-not (Test-Path $sopsExe)) { throw "sops not found (PATH or $sopsExe)" }

          # self-hosted 러너의 영속 워크스페이스에는 gitattributes(eol=lf) 도입 전에
          # 체크아웃된 CRLF .env.enc가 남아있을 수 있다. blob이 안 바뀌면 checkout이
          # 워킹트리를 재기록하지 않아 CRLF가 그대로 눌러앉는다. 그러면 SOPS가 메타데이터
          # 타임스탬프의 \r까지 파싱해 'parsing time ... \x0d'로 실패하므로, 복호화 직전
          # CR을 제거한다(.env.enc는 순수 ASCII라 안전). .NET WriteAllText는 BOM/CRLF를
          # 추가하지 않는다.
          $encPath = Join-Path $PWD '.env.enc'
          $enc = [IO.File]::ReadAllText($encPath)
          if ($enc.Contains("`r")) {
            [IO.File]::WriteAllText($encPath, $enc.Replace("`r", ""))
            Write-Host 'normalized .env.enc CRLF -> LF before decrypt'
          }

          $keyFile = Join-Path $env:TEMP 'age-cd-key.txt'
          Set-Content -Path $keyFile -Value $env:AGE_KEY -NoNewline
          try {
            $env:SOPS_AGE_KEY_FILE = $keyFile
            & $sopsExe --decrypt --input-type dotenv --output-type dotenv --output .env .env.enc
            if ($LASTEXITCODE -ne 0) { throw 'sops decrypt failed' }
            Write-Host ".env decrypted from .env.enc (SOPS+age) via $sopsExe"
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

          # --- 3) digest 로 pull (러너는 직전 'Log in to ghcr' 스텝에서 인증됨) ---
          # 태그가 아니라 digest 로 당기므로 레지스트리의 태그가 지금 무엇을 가리키든 무관하다.
          # 예전에 있던 'docker inspect --format {{index .RepoDigests 0}}' 단계는 사라졌다.
          # 이미 digest 를 들고 있고, 0번이 우리 레포라는 보장도 없었다 - 아래 5)의
          # 'docker tag $appImage ott-backend:clean' 이 만든 짧은 이름이 RepoDigests 에
          # 함께 들어가고, 그게 0번을 차지한다. 2026-09-02 이 러너에서 실측한 값이다:
          #   [0] ott-backend@sha256:25b15ac...        <- 예전 코드가 고르던 것
          #   [1] ghcr.io/kimgyuhyun/ott-backend@sha256:25b15ac...
          # 이미지 4개 전부 같은 상태였다. 즉 배포 직전 "고정"이 레지스트리 이름이 아니라
          # 로컬 이름을 가리키고 있었고, :clean 태그가 언제 붙었는지에 따라 값이 뒤집혔다.
          Write-Host '=== PULL from ghcr (by digest) ==='
          foreach ($img in $appImage, $frontImage, $squidImage, $sockdImage) {
            docker pull $img; if ($LASTEXITCODE -ne 0) { throw "pull failed: $img" }
          }

          # digest 로만 당긴 이미지는 로컬에 repo 태그가 없다. 아래 6)의 docker image prune 이
          # 직전 릴리스 이미지를 지워 로컬 롤백 지점을 없앨 수 있으므로 커밋 SHA 태그를 붙여 둔다.
          docker tag $appImage   "ghcr.io/$owner/ott-backend:$sha"
          docker tag $frontImage "ghcr.io/$owner/ott-frontend:$sha"
          docker tag $squidImage "ghcr.io/$owner/ott-egress-proxy:$sha"
          docker tag $sockdImage "ghcr.io/$owner/ott-smtp-proxy:$sha"

          # --- 4) 보안 게이트: pull된 이미지에 마이너 IOC 없는지 스캔 ---
          # 오탐 방지를 위해 "특정성 높은 IOC만 대소문자 구분"으로 검사한다.
          #  - 내용(content) grep: C2 IP / 채굴풀 / 드로퍼명처럼 정상 코드엔 없는 문자열만.
          #    ('javae'는 Java의 'JavaE/JavaEE'에 오탐되므로 content에서 제외)
          #  - 파일명(find): 실제 마이너 바이너리가 베이크됐는지 정확한 이름으로만 검사.
          $iocContent = '221\.156\.167\.200|supportxmr|grepb32'
          foreach ($img in $appImage, $frontImage) {
            $scan = (docker run --rm --network none --entrypoint sh $img -c "grep -raoE '$iocContent' /app 2>/dev/null | head -1; find / -xdev -type f \( -name javae -o -name 'xmrig*' -o -name cpuminer \) 2>/dev/null | head -1" | Out-String).Trim()
            if ($scan) { throw "MALWARE IOC detected in $img ($scan) -> DEPLOY ABORTED" }
            Write-Host "scan clean: $img"
          }

          # --- 4b) 컨테이너가 마운트할 설정 파일을 러너 작업폴더 밖으로 복사 ---
          # 도커 데스크톱의 bind mount 는 로그인한 데스크톱 계정 권한으로 열린다. 러너
          # 작업폴더에는 평문 .env 가 있어 그 계정에 읽기를 줄 수 없으므로, 마운트되는
          # 설정 파일만 이 폴더로 내보낸다(compose 의 마운트 원본도 이 경로를 가리킨다).
          # 위치가 IOC 게이트 "뒤" 인 것이 중요하다. 앞에 두면 스캔이 배포를 중단시켜도
          # 디스크의 설정만 새것으로 갱신돼, 다음 force-recreate 가 새 설정 + 옛 이미지로 뜬다.
          $cfgRoot = 'C:\ott-deploy\config'
          foreach ($rel in @('nginx\nginx.prod.conf', 'nginx\nginx.prod.ha.conf', 'security\initdb',
                             # 아웃바운드 허용목록. 빠지면 프록시가 설정 없이 떠서 배포 전체가 실패한다.
                             'proxy\squid.conf', 'proxy\sockd.conf',
                             'rabbitmq\10-memory.conf', 'monitoring\prometheus.yml',
                             'monitoring\rules',
                             'monitoring\loki\loki-config.yml', 'monitoring\alloy\config.alloy',
                             'monitoring\grafana\provisioning', 'monitoring\grafana\dashboards')) {
            $src = Join-Path $PWD $rel
            $dst = Join-Path $cfgRoot $rel
            if (-not (Test-Path $src)) { throw "config source missing: $src" }
            New-Item -ItemType Directory -Path (Split-Path $dst -Parent) -Force | Out-Null
            if (Test-Path $src -PathType Container) {
              # 폴더는 루트를 지우지 않고 내용만 미러링한다(/MIR 이 지워진 파일까지 반영).
              # 통째 삭제 후 재복사는 실행 중 컨테이너가 붙든 마운트를 끊을 수 있고, 삭제만
              # 성공하고 복사가 실패하면 설정 폴더가 없는 채로 배포가 멈춘다.
              robocopy $src $dst /MIR /NJH /NJS /NFL /NDL | Out-Null
              # robocopy 는 성공해도 0 이 아니다(1=복사함, 2·3=여분 삭제). 8 이상만 실패다.
              if ($LASTEXITCODE -ge 8) { throw "robocopy failed (exit $LASTEXITCODE): $src -> $dst" }
              $global:LASTEXITCODE = 0   # 뒤의 $LASTEXITCODE 검사들이 오판하지 않도록 되돌린다
            } else {
              # 바이트 그대로가 아니라 LF 로 정규화해서 내보낸다. 러너 git 은
              # core.autocrlf=true 라 작업폴더의 설정 파일이 CRLF 이고, .gitattributes 에
              # eol=lf 를 넣어도 "이미 받아둔" 파일은 다시 쓰이지 않는다 — 인덱스의 stat
              # 캐시가 그 파일을 수정 없음으로 보기 때문에 checkout 도 reset --hard 도
              # 건드리지 않는다(2026-08-08 실측: 규칙만 추가한 배포가 그대로 또 깨졌다).
              # dante sockd 는 CRLF 설정을 'near token "\r"' 로 거부하고 크래시 루프에
              # 빠진다 — SMTP 아웃바운드 전면 정지. squid·nginx 는 견디지만 우연일 뿐이다.
              # 여기서 복사하는 단일 파일은 전부 리눅스 컨테이너가 읽는 설정이라 CR 이
              # 필요한 곳이 없다(대상 전부 BOM 없는 UTF-8 임을 확인함. WriteAllText 도
              # BOM 없는 UTF-8 로 쓴다).
              [IO.File]::WriteAllText($dst, ([IO.File]::ReadAllText($src) -replace "`r`n", "`n"))
            }
          }
          Write-Host "config copied to $cfgRoot ($((Get-ChildItem $cfgRoot -Recurse -File).Count) files)"

          # --- 5) 배포: digest 고정 이미지 + egress 차단 스택 + 무중단 순차 교체 ---
          # 배포 명령을 여기에 복사해두지 않고 deploy-rolling.ps1 을 호출한다.
          # 예전에는 CD 가 compose 명령을 따로 들고 있어서, 수동 배포와 CD 가 서로 다른
          # 파일 세트를 배포하는 드리프트가 생겼다(2026-07-20: 수동은 2인스턴스인데
          # CD 는 ha 오버레이를 몰라서 --remove-orphans 로 ott-app-2 를 지워버리는 상태였음).
          # 스크립트 하나만 고치면 양쪽이 같이 바뀌도록 경로를 하나로 합친다.
          #
          # 스크립트가 하는 일: 4파일 세트(yml+prod+netlock+ha)로 비백엔드부터 올리고,
          # 백엔드는 ott-app → ott-app-2 순으로 하나씩 교체하며 각각 헬스를 확인한다.
          # 동시 재생성은 실측 22초 장애(197요청 중 164건 502), 순차 교체는 1441요청 무실패.
          Write-Host '=== DEPLOY (digest-pinned, egress-locked, rolling) ==='
          $env:APP_IMAGE = $appImage
          $env:FRONT_IMAGE = $frontImage
          $env:APP_PULL_POLICY = 'never'      # 이미 pull됨
          $env:FRONT_PULL_POLICY = 'never'
          $env:SQUID_IMAGE = $squidImage
          $env:SOCKD_IMAGE = $sockdImage
          $env:SQUID_PULL_POLICY = 'never'
          $env:SOCKD_PULL_POLICY = 'never'
          .\deploy-rolling.ps1
          if ($LASTEXITCODE -ne 0) { throw 'rolling deploy failed' }
          docker exec ott-nginx nginx -t; if ($LASTEXITCODE -ne 0) { throw 'nginx -t failed' }
          docker exec ott-nginx nginx -s reload

          # 수동 배포용 clean 태그를 방금 배포한 이미지로 맞춘다.
          # 이 두 줄이 없으면 태그가 낡아, 수동 compose 배포 시 백엔드·프론트가 조용히
          # 구버전으로 다운그레이드된다(2026-07-20 에 실제로 그 상태였다).
          docker tag $appImage ott-backend:clean
          docker tag $frontImage ott-frontend:clean
          docker tag $squidImage ott-egress-proxy:clean
          docker tag $sockdImage ott-smtp-proxy:clean

          # --- 6) 검증: 백엔드 헬스 + 프론트엔드 egress 차단(보안 불변식) ---
          # 기동 직후엔 백엔드가 아직 listen 전이라 wget이 'connection refused'(stderr)를 낸다.
          # PowerShell(Stop)에서 네이티브 stderr는 종료성 오류가 되므로 try/catch로 감싸 재시도한다.
          Write-Host '=== VERIFY ==='
          $healthy = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 5
            $h = ''
            try { $h = "$(docker exec ott-nginx wget -qO- -T3 http://ott-app:8090/actuator/health 2>$null)" } catch { $h = '' }
            if ($h -match 'UP') { $healthy = $true; Write-Host 'backend healthy (status UP)'; break }
            Write-Host "  waiting for backend ($i/30)"
          }
          if (-not $healthy) { throw 'backend health check failed (timeout ~150s)' }

          # egress 차단 판정을 음성 결과로 하지 않는다.
          # 예전 코드는 docker exec 실패나 빈 출력을 'BLOCKED' 로 읽어서, node 가 없거나
          # 컨테이너 이름이 틀려도 보안 불변식을 통과시켰다. "찾은 것이 없다"는 차단됐다는
          # 뜻과 확인 명령이 틀렸다는 뜻을 구분하지 못한다.
          # 그래서 도달 가능해야 하는 목적지(ott-app:8090)로 같은 프로브를 먼저 쏴서
          # REACHABLE 이 나오는지 확인하고(양성 대조), 그 뒤에야 외부 차단을 판정한다.
          # 대조가 실패하면 프로브가 고장난 것이므로 배포를 실패로 처리한다.
          $probe = "const s=require('net').connect({host:process.argv[1],port:Number(process.argv[2]),timeout:3500});s.on('connect',()=>{console.log('REACHABLE');process.exit()});s.on('timeout',()=>{console.log('BLOCKED');process.exit()});s.on('error',()=>{console.log('BLOCKED');process.exit()})"
          function Invoke-EgressProbe([string]$targetHost, [int]$targetPort) {
            try { return (docker exec ott-frontend node -e $probe $targetHost $targetPort 2>&1 | Out-String).Trim() }
            catch { return "PROBE-ERROR: $($_.Exception.Message)" }
          }

          $control = Invoke-EgressProbe 'ott-app' 8090
          if ($control -ne 'REACHABLE') { throw "egress probe control failed (ott-app:8090 -> '$control') - cannot judge egress blocking" }
          Write-Host 'egress probe control: ott-app:8090 -> REACHABLE'

          $egress = Invoke-EgressProbe '1.1.1.1' 443
          if ($egress -eq 'REACHABLE') { throw 'SECURITY INVARIANT FAILED: frontend egress is NOT blocked' }
          if ($egress -ne 'BLOCKED') { throw "egress probe returned an unexpected result ('$egress') - not treating it as blocked" }
          Write-Host 'frontend egress: BLOCKED (verified against a working control)'

          try { docker image prune -f --filter "until=168h" 2>$null | Out-Null } catch {}
          Write-Host '=== CD END (secure) ==='

name: CI

# ============================================================================
# 보안 재설계 (2026-06-24): Docker Hub(para98, 공개·침해이력) → GitHub Container
# Registry(ghcr.io, 비공개) 전환. 인증은 GITHUB_TOKEN(단기 토큰) → 장기 자격증명
# (REGISTRY_USER/PASSWORD) 불필요. main push 시에만 이미지를 :<commit-sha>로 push하고
# Trivy로 스캔(수정 가능한 CRITICAL이 있으면 실패 → CD로 진행 안 됨).
# 배포(CD)는 cd.yml이 이 이미지를 digest로 고정해 받아간다.
# ============================================================================
on:
  push:
    branches: [ main ]
  pull_request:

# 워크플로 기본 토큰 권한은 읽기로 둔다. 쓰기가 필요한 잡에서만 개별로 올린다.
# 여기에 packages:write 를 두면 앞으로 추가되는 모든 잡(스캔·검증 등)이 필요 없는
# 레지스트리 쓰기 권한을 물려받는다.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # 시크릿 스캔은 훅과 CI 양쪽에서 돈다(PLATFORM.md 1절). 훅은 로컬에서 우회될 수 있고,
  # CI 는 이미 커밋된 것만 본다. 한쪽만으로는 충족되지 않는다.
  # 액션 대신 릴리스 바이너리를 버전 고정 + 체크섬 검증으로 받는다 — 원격 스크립트를
  # 받아 바로 실행하지 않는다는 6절 조항을 지키면서 액션 의존성도 늘리지 않는다.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # 히스토리 전체를 봐야 과거 커밋에 들어간 값도 잡힌다
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # 탐지되면 비정상 종료해 배포로 진행되지 않는다.
      # 알려진 과거 탐지는 .gitleaksignore 에 지문으로 적혀 있다(사유도 그 파일에).
      - name: Scan history for secrets
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  # 워크플로와 셸 스크립트도 코드다. CD 가 self-hosted 러너에서 실제 배포를 자동 실행하는데
  # 그 배포를 태우는 이 파일들만 지금까지 아무 검사도 받지 않았다.
  # 액션 대신 릴리스 바이너리를 버전 고정 + 체크섬 검증으로 받는다 — secret-scan 잡과 같은 이유다.
  # (체크섬은 배포처가 게시한 actionlint_1.7.12_checksums.txt 와 대조한 값이다)
  iac-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint (pinned, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
      # actionlint 는 PATH 의 shellcheck 를 찾아 run: 블록 안의 셸까지 함께 본다.
      # shellcheck 는 러너 이미지에 이미 포함돼 있어 따로 설치하지 않는다.
      - name: Lint workflows
        run: ./actionlint
      # 스크립트 파일 자체. .githooks/pre-commit 은 확장자가 없어 glob 에 안 걸리므로 직접 적는다.
      - name: Lint shell scripts
        run: shellcheck -x .github/scripts/*.sh .githooks/pre-commit

  # 마이그레이션 검증 전용 잡.
  # 슬라이스 테스트는 H2 로 돌고 전부 flyway.enabled=false 라, Flyway 가 실제로 처음
  # 실행되는 곳이 CD 의 운영 DB 였다. 여기서 빈 Postgres 에 전량 적용해보고 검증한다.
  # 이미지는 운영과 같은 메이저(15)로 맞춘다 — 다른 버전에서 통과하면 검증이 아니다.
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ott_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ott_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Apply and validate migrations on an empty database
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/ott_ci
          FLYWAY_USER: ci
          FLYWAY_PASSWORD: ci
        run: |
          cd backend
          chmod +x gradlew || true
          ./gradlew flywayMigrate flywayValidate

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ghcr push (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          # Spotless 의 ratchetFrom 이 origin/main 과의 차이를 보므로 히스토리가 필요하다.
          # 얕은 클론이면 base ref 를 못 찾아 spotlessCheck 가 빌드를 깨뜨린다.
          fetch-depth: 0
      # 래퍼 JAR 해시 불일치는 공급망 침해 신호이므로 차단한다.
      # (continue-on-error 로 두면 침해를 탐지하고도 그대로 빌드가 진행된다)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backend (Gradle)
        # 테스트를 함께 실행한다(-x test 제거). 핵심 로직 회귀가 빌드 시점에 잡히도록 하는 것이 목적이므로
        # 테스트가 깨지면 이미지 push/배포로 진행되지 않아야 한다.
        run: |
          cd backend
          chmod +x gradlew || true
          ./gradlew clean build

      # 빌드 성공은 테스트가 실행됐다는 뜻이 아니다. 결과 XML 의 실행 건수로 판정한다.
      # MIN_TESTS 는 이 커밋 시점의 실측치다. 테스트를 의도적으로 줄일 때만 함께 낮춘다.
      # REQUIRED_CLASSES 는 Testcontainers 를 쓰는 결제·인증 경로다. 이 8개는 도커가 없으면
      # 통째로 skip 되는데 전체 420건 중 24건뿐이라 총량 하한만으로는 놓칠 수 있다.
      - name: Gate on executed test count
        env:
          RESULTS_DIR: backend/build/test-results/test
          MIN_TESTS: '420'
          REQUIRED_CLASSES: >-
            PaymentCheckoutIdempotencyTest PaymentConfirmIdempotencyTest
            ProrationConfirmIdempotencyTest RefundIdempotencyTest
            MembershipCancelIdempotencyTest PaymentMerchantUidUniqueTest
            RecurringBillingServiceTest RebillMerchantUidTest
            OriginValidationFilterTest LoginAttemptServiceTest
            EmailAuthServiceTest OAuth2UserServiceTest
        run: bash .github/scripts/check-test-count.sh

      # 정적 분석은 clean build 의 check 단계에서 함께 돌았다. 여기서는 그 리포트를 읽어
      # 보안 범주만 차단한다. 스타일 지적은 리포트에 남지만 빌드를 막지 않는다.
      - name: Gate on SpotBugs security findings
        env:
          SPOTBUGS_REPORT: backend/build/reports/spotbugs/main.xml
          # SECURITY 만 차단한다. MALICIOUS_CODE(대부분 EI_EXPOSE_REP: 가변 객체를 그대로
          # 반환/보관)는 이 코드베이스에서 44건 나오는데, 익스플로잇 가능한 결함이 아니라
          # 캡슐화 지적에 가깝다. 차단으로 두면 코드 변경 없이 파이프라인이 멈추고 결국
          # 게이트를 끄게 된다. 리포트에는 계속 남으니 줄여나갈 근거는 유지된다.
          BLOCK_CATEGORIES: SECURITY
        run: bash .github/scripts/check-spotbugs-security.sh

      - name: Compute lowercase image ref
        id: img
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ott-backend" >> "$GITHUB_OUTPUT"
      - name: Login to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push backend image (by commit SHA)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --pull -t ${{ steps.img.outputs.ref }}:${{ github.sha }} -f backend/Dockerfile backend/
          docker push ${{ steps.img.outputs.ref }}:${{ github.sha }}
      - name: Scan backend image (gate on fixable CRITICAL)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'   # [2026-07-18] 게이트 활성화: 패치 가능한 CRITICAL 이 있으면 CI 실패 → push/배포 차단. ignore-unfixed 라 고칠 수 없는 취약점엔 안 막힘(무한 실패 방지).
          format: 'table'

  # [SECURITY 2026-08-07] 백엔드 아웃바운드 프록시 2개. 백엔드/프론트와 완전히 같은 경로로
  # 다룬다(커밋 SHA 태그로 push → Trivy 게이트 → CD 가 digest 로 고정). 업스트림 이미지를
  # 쓰지 않고 직접 빌드하는 이유는 각 Dockerfile 상단 참고.
  # 빌드 산출물이 없어 별도 빌드 스텝이 없다 — docker build 가 전부다.
  proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ghcr push (GITHUB_TOKEN)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ott-egress-proxy
            context: proxy/squid
          - name: ott-smtp-proxy
            context: proxy/sockd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute lowercase image ref
        id: img
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - name: Login to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PR 에서도 빌드는 돌려서 Dockerfile 이 깨진 채 main 에 들어가지 않게 한다.
      # --pull 은 붙이지 않는다: 베이스가 digest 로 고정돼 있어 받아올 다른 이미지가 없다.
      - name: Build image
        run: docker build -t ${{ steps.img.outputs.ref }}:${{ github.sha }} ${{ matrix.context }}
      - name: Push image (by commit SHA)
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ steps.img.outputs.ref }}:${{ github.sha }}
      - name: Scan image (gate on fixable CRITICAL)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # ghcr push (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
      - name: Use Node.js 18
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      # 린트를 명시 스텝으로 둔다. next.config.ts 가 eslint.ignoreDuringBuilds=true 라
      # next build 는 ESLint 를 돌리지 않는다 — 그 부수효과에 기대는 동안 지적 117건이
      # 쌓였고 그 중 하나는 error 였다. 빌드의 부수효과는 설정 한 줄로 조용히 사라지는데,
      # 사라져도 빌드는 초록불이라 게이트가 없어진 것을 알 수 없다.
      # ignoreDuringBuilds 는 그대로 둔다: 린트 실패로 이미지 빌드까지 깨질 이유가 없다.
      # --max-warnings 는 이 커밋 시점의 실측치다. 기존 지적을 청산하지 않고도 새 지적만
      # 막기 위한 기준선이므로, 줄어들면 함께 낮춘다. 올리는 방향으로는 고치지 않는다.
      - name: Lint frontend
        run: |
          cd frontend
          npx eslint --max-warnings 116
      # 포맷은 결정론적이고 자동 수정되므로 차단해도 준수 비용이 0 이다.
      # 기존 코드는 도입 시 일괄 적용했다(.git-blame-ignore-revs 참고).
      - name: Check frontend formatting
        run: |
          cd frontend
          npx prettier --check .
      - name: Build frontend
        run: |
          cd frontend
          npm run build
      - name: Compute lowercase image ref
        id: img
        run: echo "ref=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ott-frontend" >> "$GITHUB_OUTPUT"
      - name: Login to ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push frontend image (by commit SHA)
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --target production --pull -t ${{ steps.img.outputs.ref }}:${{ github.sha }} -f frontend/Dockerfile frontend/
          docker push ${{ steps.img.outputs.ref }}:${{ github.sha }}
      - name: Scan frontend image (gate on fixable CRITICAL)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:${{ github.sha }}
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'   # [2026-07-18] 게이트 활성화: 패치 가능한 CRITICAL 이 있으면 CI 실패 → push/배포 차단. ignore-unfixed 라 고칠 수 없는 취약점엔 안 막힘.
          format: 'table'

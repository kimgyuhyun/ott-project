## 의존성 그래프(Gradle) — 백엔드의 전이 의존성까지 GitHub 의존성 그래프에 제출한다.
##
## 왜 필요한가:
##   GitHub 는 build.gradle 을 정적으로 읽지 못해서, 제출하지 않으면 Gradle 의존성이 그래프에 하나도 없다.
##   그러면 Dependabot alerts 가 백엔드를 아예 보지 못한다(tomcat·netty 같은 전이 의존성 CVE 포함).
##   저장소 설정의 Automatic dependency submission 은 main push 뒤에도 돌지 않았다(2026-09-30 확인,
##   빌드가 저장소 루트가 아니라 backend/ 에 있어서로 보인다). 그래서 워크플로로 직접 제출한다.
##   그 설정은 끈다 — 둘 다 켜져 있으면 같은 그래프를 두 번 제출한다.
##
## 그래프는 마지막 제출이 유지되므로 빌드 정의가 바뀔 때만 돈다.
name: Dependency graph (Gradle)

on:
  push:
    branches: [main]
    paths:
      - 'backend/build.gradle'
      - 'backend/settings.gradle'
      - 'backend/gradle.lockfile'
      - 'backend/gradle/**'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # Dependency submission API 쓰기 권한
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          build-root-directory: backend

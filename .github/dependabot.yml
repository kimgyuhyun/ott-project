version: 2
updates:
  # 프론트엔드 (Next.js / npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]
      # 보안 PR 도 하나로 묶는다. 이 파일이 있으면 저장소 설정의 Grouped security updates 가 아니라
      # 여기 그룹을 따른다 — 그룹이 없을 때 보안 PR 이 패키지마다 따로 왔다(머지 1번 = 배포 1번).
      # 보안 PR 은 아래 ignore 의 update-types 를 따르지 않는다. 고치는 버전이 메이저면 메이저로 온다.
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # 메이저 버전 업그레이드는 breaking change 위험이 커서 자동 PR 제외(수동 처리)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 백엔드 (Spring Boot / gradle)
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-minor:
        update-types: ["minor", "patch"]
      # 보안 PR 묶음 — 이유는 위 frontend-security 와 같다.
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # 메이저 버전 업그레이드는 breaking change 위험이 커서 자동 PR 제외(수동 처리)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # compose 파일의 이미지(postgres, redis, kafka, rabbitmq, nginx, 모니터링 등)
  # 전부 "태그@sha256:index-digest" 로 고정돼 있어, 이 항목이 없으면 패치가 영원히 들어오지 않는다.
  # 아래 docker 와 같은 이유로 daily, 메이저도 받는다. 메이저 PR 은 자동 머지하지 않는다(PLATFORM 6절).
  # postgres 메이저는 데이터 디렉터리 포맷이 달라 PR 머지(=배포)만으로는 DB 가 뜨지 않는다.
  # 그런 PR 은 데이터 이전 절차(덤프·복원 또는 pg_upgrade)를 먼저 세운 뒤에 다룬다.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"

  # Docker 베이스 이미지
  # npm/gradle과 달리 Docker는 advisory 매핑이 없어 security update PR이 따로 오지 않는다.
  # 이 스케줄이 곧 유일한 패치 주기이므로 daily로 둔다(다이제스트가 실제로 움직일 때만 PR이 열린다).
  # 메이저를 무시하지 않는다. npm·gradle 과 달리 여기 메이저는 런타임(Node, JDK) 자체라,
  # 막아두면 그 메이저가 EOL 이 돼도 PR 이 오지 않는다(node:20 이 EOL 을 넘기고도 그대로 남아 있었다).
  # 메이저 PR 은 자동 머지하지 않는다(PLATFORM 6절). 손으로 확인하고 머지한다.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "daily"
  # 백엔드 아웃바운드 프록시 2개. 빌드 스테이지의 alpine 을 digest 로 고정했는데 이 항목이
  # 없어서 패치 PR 이 한 번도 오지 않았다. 위 두 항목과 합치지 않은 것은 이미 열린 그쪽 PR 을
  # 건드리지 않기 위해서다.
  - package-ecosystem: "docker"
    directories: ["/proxy/squid", "/proxy/sockd"]
    schedule:
      interval: "daily"
    groups:
      # 두 Dockerfile 이 같은 alpine 을 쓴다. 묶지 않으면 같은 갱신이 PR 두 개(배포 두 번)로 온다.
      proxy-base:
        patterns: ["*"]

  # GitHub Actions 워크플로우
  # 메이저를 무시하지 않는다. 액션 메이저는 대개 액션 런타임 교체(node20 → node24)라,
  # 막아두면 러너가 옛 런타임을 내릴 때 워크플로가 깨진다. 자동 머지하지 않는 것은 위와 같다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

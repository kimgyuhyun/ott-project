# ============================================================================
# Prometheus + Grafana (opt-in) — 백엔드 관측성(metrics) 스택
# ----------------------------------------------------------------------------
# 목적: 무중단 배포/다중 인스턴스 실험을 그래프로 관측한다.
#   - Prometheus 가 ott-app / ott-app-2 의 /actuator/prometheus 를 15초마다 긁는다.
#   - Grafana 가 Prometheus 를 데이터소스로 그래프를 그린다.
#   - Alloy 가 백엔드 외 컨테이너(nginx/postgres/redis/kafka/rabbitmq/frontend)의
#     로그를 Loki 로 보낸다. 백엔드는 loki4j 로 직접 push 하므로 제외한다.
#     (설계 근거는 monitoring/alloy/config.alloy 상단 주석 참고)
#
# 네트워크 설계 (pgadmin.yml 과 동일한 패턴):
#   - Prometheus 는 default(웹 계층)에 붙어 ott-app:8090 / ott-app-2:8090 에 도달한다.
#     (netlock 배포 시 default 는 internal 이지만 컨테이너 간 통신은 유지되므로 스크레이프 가능)
#   - internal 네트워크는 호스트로 포트 publish 가 불가하므로, 별도 bridge(monitoring)에도
#     연결해 127.0.0.1 로만 포트를 연다(외부 노출 없음).
#   - 데이터 계층(data)에는 붙이지 않는다 — 모니터링은 postgres/redis 에 직접 접근할 이유가 없다.
#   - 주의: monitoring 은 bridge 라 egress 가 열린다(호스트 포트 publish 를 위해 불가피).
#     pgadmin-egress 와 동일한 트레이드오프. Grafana 텔레메트리/업데이트확인은 env 로 꺼둔다.
#
# 올리기(기존 스택은 그대로 두고 모니터링만 추가):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml `
#     -f docker-compose.netlock.yml -f docker-compose.ha.yml `
#     -f docker-compose.monitoring.yml up -d --no-deps prometheus loki grafana alloy
#
# 내리기(필요 없을 때):
#   docker compose ... -f docker-compose.monitoring.yml rm -sf prometheus loki grafana alloy
#
# 접속:
#   - Prometheus: http://127.0.0.1:9090   (타깃 상태: Status > Targets)
#   - Grafana:    http://127.0.0.1:3001   (admin / GRAFANA_PASSWORD, 기본 admin1234)
# ============================================================================
# base(docker-compose.yml)의 x-logging 과 같은 값. YAML 앵커는 파일을 넘어가지 못해
# 여기서 다시 정의한다. 이 파일 안의 서비스도 전부 로그 회전 상한을 갖게 한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# [SECURITY 2026-07-31] 이 파일의 서비스도 PLATFORM 2절 "모든 컨테이너" 대상이다.
# alloy 에만 걸려 있던 no-new-privileges/cap_drop 을 나머지 셋에도 넣는다.
# 셋 다 이미지가 비root 로 뜨고(prometheus=nobody:65534, grafana=472, loki=10001)
# 듣는 포트가 전부 1024 이상이라(9090/3000/3100) 되돌릴 capability 가 없다 → 순수 cap_drop: ALL.
# pull_policy: missing 근거는 docker-compose.yml 상단 주석 참고.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    pull_policy: missing
    container_name: ott-prometheus
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # 루프백 전용 노출 (외부 X)
    networks:
      - default        # ott-app / ott-app-2 스크레이프용 (앱이 붙어있는 웹 계층)
      - monitoring     # grafana 통신 + 호스트 포트 publish용

  loki:
    image: grafana/loki:3.1.1
    pull_policy: missing
    container_name: ott-loki
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # 루프백 전용 (디버깅용)
    networks:
      - default        # 백엔드(ott-app/ott-app-2)가 로그를 푸시하는 경로
      - monitoring     # grafana 조회 + 호스트 포트 publish용

  grafana:
    image: grafana/grafana:11.2.0
    pull_policy: missing
    container_name: ott-grafana
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin1234}
      GF_ANALYTICS_REPORTING_ENABLED: "false"   # 사용통계 전송 차단
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"   # 업데이트 확인 아웃바운드 차단
      GF_USERS_ALLOW_SIGN_UP: "false"           # 가입 비활성
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro   # provisioning 이 로드할 대시보드 JSON
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # 루프백 전용 (3000 은 frontend 가 사용 중이라 3001)
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.5.1
    pull_policy: missing
    container_name: ott-alloy
    restart: unless-stopped
    # --disable-reporting: 그라파나로 나가는 사용통계 전송 차단(어차피 egress 없음, 명시).
    # UI(12345)는 호스트로 publish 하지 않는다 — 필요하면 docker exec 로 본다.
    command:
      - run
      - /etc/alloy/config.alloy
      # 이미지 기본 경로(/var/lib/alloy/data)를 쓰지 않는 이유: 그 디렉터리는 이미지에서
      # alloy 유저 소유 0700 이고, 볼륨이 그 소유권을 그대로 물려받는다. cap_drop:ALL 로
      # DAC_OVERRIDE 가 없어 root 라도 쓰기가 막힌다(mkdir: permission denied).
      # 이미지에 없는 경로에 볼륨을 붙이면 도커가 root:root 0755 로 만들어줘 그냥 된다.
      - --storage.path=/alloy-data
      - --disable-reporting
    # 로그 파일 디렉터리는 root:root 0700 이라 root 로 읽어야 한다.
    # cap_drop ALL 상태이므로 root 라도 커널 권한은 없고, 파일 접근은 읽기 전용이다.
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # [SECURITY] docker.sock 은 마운트하지 않는다. 소켓은 뚫리면 호스트 장악으로
      # 이어지고 :ro 로 붙여도 API 호출은 막히지 않는다. 로그 파일만 읽기 전용으로 붙인다.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/alloy-data
    read_only: true          # 루트FS 읽기전용 (쓰기는 alloy_data 볼륨과 아래 tmpfs 뿐)
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *default-logging
    depends_on:
      - loki
    networks:
      - default        # loki:3100 push 경로. netlock 시 internal 이라 egress 없음.

  # --- 수집 대상 컨테이너에 이름표 달기 ---------------------------------------
  # 로그 파일 경로에는 컨테이너 ID밖에 없다. docker.sock 없이 ID→이름을 얻을 수 없으므로,
  # json-file 드라이버의 labels 옵션으로 도커가 로그 각 줄에 이름을 써넣게 한다.
  # (log_service 라벨이 없는 컨테이너는 Alloy 가 통째로 버린다 = 백엔드 중복 방지)
  # 주의: logging 설정 변경은 해당 컨테이너를 1회 재생성시킨다.
  postgres:
    labels: { log_service: postgres }
    logging: { driver: json-file, options: { labels: log_service } }

  redis:
    labels: { log_service: redis }
    logging: { driver: json-file, options: { labels: log_service } }

  kafka:
    labels: { log_service: kafka }
    logging: { driver: json-file, options: { labels: log_service } }

  rabbitmq:
    labels: { log_service: rabbitmq }
    logging: { driver: json-file, options: { labels: log_service } }

  frontend:
    labels: { log_service: frontend }
    logging: { driver: json-file, options: { labels: log_service } }

  nginx:
    labels: { log_service: nginx }
    logging: { driver: json-file, options: { labels: log_service } }

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  monitoring:
    driver: bridge

# 프로덕션용 오버라이드 - docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

# [SECURITY 2026-07-31] 리소스 상한 — PLATFORM 2절 "컨테이너 리소스 상한(CPU, 메모리)을
# 설정한다. 상한이 없으면 하나의 침해나 폭주가 호스트 전체를 멈춘다."
# 그동안 app/frontend/alloy 에만 있었다. 나머지는 docker stats 가 "/ 15.53GiB" 로 찍혔다 —
# 각자 호스트 메모리 전체를 자기 몫으로 보고 있었다는 뜻이다.
#
# 목적은 밀집 배치가 아니라 봉쇄다. 즉 "한 컨테이너가 호스트 전체를 먹지 못하게" 하는 것이
# 목표이므로, 정밀한 사이징 대신 평상시 사용량보다 훨씬 위에 천장을 둔다. 아래 값은 전부
# 현재 사용량의 6~150배라 정상 운영 중에는 닿지 않는다.
#
# 메모리와 CPU 는 성격이 다르므로 배분 방식도 다르다:
#   - mem_limit 초과 = 커널이 프로세스를 SIGKILL. 그래서 합계가 호스트 용량(15.53GiB)을
#     넘지 않게 잡는다. 넘게 잡으면 전부 천장까지 갔을 때 호스트가 죽어 상한이 무의미해진다.
#     합계 13.5g / 15.53g (여유 약 2g).
#   - cpus 초과 = 스로틀링(느려질 뿐 죽지 않음). 예약이 아니라 상한이고 전부 동시에 천장을
#     치지도 않으므로 합계가 코어 수를 넘어도 된다. 합계 16.0 / 12코어(1.33배 오버커밋).
#     중요한 건 총합이 아니라 단일 컨테이너 최대치가 2.0(호스트의 17%)이라는 것이다.
#
# 숫자를 조일 근거가 필요해지면 loadtest 의 TEST=stress 를 돌리면서 docker stats 를 같이
# 샘플링하면 된다. 봉쇄가 목적인 지금은 필요 없다(loadtest/RESULTS.md 는 CPU·DB 만 기록).
services:
  app: # Spring Boot 애플리케이션 서비스
    image: ${APP_IMAGE:-ott-backend:clean}  # CD가 APP_IMAGE=ghcr digest 로 덮어씀. 수동 배포 기본값=로컬 클린 이미지
    env_file:
      - .env  # 서버의 .env 파일 사용
    environment:
      # 프로덕션 프로파일 설정
      SPRING_PROFILES_ACTIVE: prod
      # Loki 로그 인스턴스 라벨(logback-spring.xml 의 LOKI appender). app2 는 ha.yml 에서 ott-app-2 로 override.
      LOKI_INSTANCE: ott-app
      # 프로덕션 데이터베이스 연결 정보 (실제 환경에 맞게 수정 필요)
      SPRING_DATASOURCE_URL: jdbc:postgresql://ott-postgres:5432/ott_project_db
      # [SECURITY 2026-07-18] 앱 런타임 커넥션은 최소권한 계정(ott_app)으로 낮춘다.
      # DB_APP_USERNAME/DB_APP_PASSWORD 미설정 시 root+DB_PASSWORD 로 폴백(현재 동작 유지).
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD}}
      # flyway 마이그레이션(DDL)은 계속 권한 계정 root 로 실행한다. ott_app 에는 DDL 권한을
      # 주지 않으므로, url 을 명시해 flyway 가 런타임과 분리된 별도 datasource(root)로 붙게 강제한다.
      SPRING_FLYWAY_URL: jdbc:postgresql://ott-postgres:5432/ott_project_db
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD}
      # JPA 설정 (프로덕션용)
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Redis 설정
      SPRING_DATA_REDIS_HOST: ott-redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # 소셜 로그인 설정
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      
      # 도메인 설정 (프로덕션 고정값 — 하드코딩)
      # 주의: ${BASE_URL:-기본값} 는 .env 에 BASE_URL 이 "비어있을 때만" 기본값을 쓴다.
      # .env(개발용)에 BASE_URL=http://127.0.0.1 이 값으로 있으면 그게 그대로 들어와
      # OAuth redirect_uri 가 127.0.0.1 이 되어 구글/카카오 로그인이 깨진다(엄격한 redirect_uri 검사).
      # prod 전용 파일이므로 도메인/쿠키는 .env 와 무관하게 프로덕션 값으로 고정한다.
      BASE_URL: https://laputa.kozow.com
      FRONTEND_ORIGIN: https://laputa.kozow.com
      COOKIE_DOMAIN: laputa.kozow.com
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      
      # 메일 설정
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      
      # 아임포트 결제 설정
      IAMPORT_MERCHANT_CODE: ${IAMPORT_MERCHANT_CODE}
      IAMPORT_API_KEY: ${IAMPORT_API_KEY}
      IAMPORT_API_SECRET: ${IAMPORT_API_SECRET}
      IAMPORT_WEBHOOK_URL: ${IAMPORT_WEBHOOK_URL}
      IAMPORT_KAKAO_CHANNEL_KEY: ${IAMPORT_KAKAO_CHANNEL_KEY}
      IAMPORT_TOSS_CHANNEL_KEY: ${IAMPORT_TOSS_CHANNEL_KEY}
      IAMPORT_NICE_CHANNEL_KEY: ${IAMPORT_NICE_CHANNEL_KEY}
      
      # 결제 설정
      PAYMENT_TEST_AMOUNT: ${PAYMENT_TEST_AMOUNT}
      PAYMENT_DEV_MODE: ${PAYMENT_DEV_MODE}
      
      # TMDB API
      TMDB_API_KEY: ${TMDB_API_KEY}
      
      # Redis 네임스페이스
      REDIS_NAMESPACE: ${REDIS_NAMESPACE}
      RECENT_SEARCH_TTL_DAYS: ${RECENT_SEARCH_TTL_DAYS}
      # CORS 허용 오리진 (프로덕션 도메인 명시)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://laputa.kozow.com}
    # 보안 하드닝(재침해 방어): 능력 제거 + 권한상승 차단 + /tmp만 쓰기 + 리소스 상한
    # (비root는 이미지의 USER 1001로 적용됨)
    #
    # [SECURITY 2026-08-06] read_only 적용. 2026-07-31 에 "켤 때 필요한 것"으로 남겨둔
    # 조건을 그대로 실행한 것이다. 그때의 전수 확인을 이번에 다시 돌렸고(두 인스턴스
    # 모두 `docker diff` → C /app, A /app/logs/ott-backend.log, A /app/logs/auth-audit.log)
    # 결과가 같아서, 열어야 하는 경로는 여전히 /app/logs 하나뿐이다. JVM 이 쓰는
    # 것들(hsperfdata_spring, tomcat.8090.*)은 아래 /tmp tmpfs 에서 이미 해결된다.
    #
    # 명명 볼륨이 아니라 tmpfs 를 고른 근거(= 파일 사본을 포기해도 되는 이유):
    #   1) 두 파일 다 호스트 밖 사본이 이미 있다. ott-backend.log 는 loki4j 가 Loki 로
    #      직접 push 한다. auth-audit.log 는 Loki 로 가지 않지만(AUTH_AUDIT 로거는
    #      additivity=false 에 CONSOLE+파일뿐) CONSOLE 로 stdout 에 나가고,
    #      security/log-backup.ps1 이 매일 `docker logs` 를 통째로 암호화해 R2 에 올린다.
    #   2) 명명 볼륨으로 열면 ha.yml 의 app2 가 extends 로 그 볼륨까지 상속해서 두 JVM 의
    #      RollingFileAppender 가 같은 파일에 쓴다(로테이션 경합). 인스턴스별 볼륨을 따로
    #      주면 피할 수 있지만, 사본이 이미 두 겹 있는 파일 때문에 질 복잡도가 아니다.
    #   3) 이 파일들은 지금도 컨테이너 쓰기 레이어에 있어 배포마다 사라진다. tmpfs 는 그
    #      동작을 바꾸지 않는다 — 보존을 잃는 변경이 아니다.
    #   남는 한계: `docker logs` 는 컨테이너 교체 시 초기화되므로 일일 스냅샷 사이에
    #   배포가 끼면 그 구간이 빈다. log-backup.ps1 이 이미 적어둔 기존 한계다.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # [SECURITY 2026-07-31] noexec 추가. 원래 nosuid,nodev 뿐이라 /tmp 에서 실행이
      # 가능했다 — PLATFORM 2절 "tmpfs로 여는 경로에는 noexec와 nosuid와 nodev를 건다"
      # 위반이자, 2026-06 XMRig 가 실제로 투입된 경로가 바로 /tmp 다(frontend 는 이미
      # noexec 가 걸려 있었고 app 만 빠져 있었다).
      # 안전한지 추측하지 않고 확인함: 실행 중 ott-app 의 /tmp 에는 네이티브 라이브러리가
      # 하나도 없고(find /tmp -name "*.so" → 없음), 백엔드 설정에 snappy/lz4/zstd 등
      # .so 를 /tmp 에 풀어 dlopen 하는 코덱 설정이 없다. hsperfdata 와 tomcat 작업
      # 디렉터리는 실행 권한이 필요 없다.
      - /tmp:noexec,nosuid,nodev,size=256m
      # read_only 를 켜기 위해 여는 유일한 경로(위 근거 참고).
      # mode=1777 필수 — tmpfs 기본은 root:root 0755 라 이미지의 uid 1001(spring)이 쓰지
      # 못하고, 그러면 로그가 조용히 사라진다(frontend 의 /app/.next/cache 와 같은 함정).
      # size=128m 근거: 현재 적재 속도가 25분에 52KB(≈3MB/일)다. 상한에 닿아도 실패하는
      # 것은 파일 appender 뿐이고 Loki·stdout 경로는 살아 있다. tmpfs 페이지는
      # mem_limit(2g)에 합산되므로 /tmp 256m 과 합쳐 384m 이 상한이다.
      - /app/logs:noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 2g
    cpus: 2.0

  frontend: # Next.js 프론트엔드 서비스
    image: ${FRONT_IMAGE:-ott-frontend:clean}  # CD가 FRONT_IMAGE=ghcr digest 로 덮어씀. 수동 배포 기본값=로컬 클린 이미지
    environment:
      # 프로덕션에서는 브라우저가 내부 호스트(ott-app)에 접근할 수 없으므로
      # NEXT_PUBLIC_BACKEND_ORIGIN을 노출하지 않습니다. Nginx가 /api 및 /login/oauth2/* 를 프록시합니다.
      NODE_ENV: production
    # 프로덕션에서는 볼륨 마운트 제거 (정적 파일로 실행)
    # volumes: 제거됨
    # 보안 하드닝(재침해 방어): 비root(이미지) + 읽기전용 FS + 능력 제거 + 권한상승 차단 + 리소스 상한
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
      # mode=1777 필수: tmpfs 기본은 root:root 0755라 비root(uid 1000 node)가 못 써서
      # Next의 fetch-cache mkdir이 EACCES로 실패한다. sticky+world-writable로 캐시 쓰기 허용.
      - /app/.next/cache:size=256m,mode=1777
    mem_limit: 1g
    cpus: 1.5

  redis: # Redis 캐시 서비스
    env_file:
      - .env  # REDIS_PASSWORD 주입
    # [SECURITY 2026-07-18] requirepass 인증. base 의 command 는 배열이라 오버라이드가
    # 통째로 대체하므로 기존 --save ""/--appendonly no 플래그를 함께 유지한다.
    # ${REDIS_PASSWORD:-} 는 .env 에 값이 있으면 인증 강제, 비어있으면 --requirepass ""
    # 로 인증 비활성(기존 동작 보존). Spring 은 application-prod.yml 의 REDIS_PASSWORD 로 접속.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:-}"]
    # [SECURITY 2026-07-31] 아래 하드닝은 app/frontend 에만 걸려 있었다(PLATFORM 2절은
    # "모든 컨테이너"를 요구). cap_add 는 추측이 아니라 각 이미지의 실제 entrypoint 를
    # 읽고 필요한 것만 되돌린 것이다.
    #
    # redis:7-alpine entrypoint (/usr/local/bin/docker-entrypoint.sh):
    #   find . \! -user redis -exec chown redis '{}' +   → CHOWN
    #   exec gosu redis "$0" "$@"                        → SETUID, SETGID
    # 그 외에는 없다. 포트 6379 는 1024 이상이라 NET_BIND_SERVICE 불필요.
    # no-new-privileges 와 gosu 는 충돌하지 않는다 — gosu 는 setuid 바이너리가 아니라
    # setuid(2) 를 직접 호출해 권한을 "내리기"만 하므로 NNP 의 금지 대상이 아니다.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    # 현재 3.4MB. 영속화가 꺼져 있고(--save "" --appendonly no) 진행률 write-back 버퍼는
    # 10초마다 비워진다. 512m 은 현재의 150배로, 사실상 폭주 감지용 천장이다.
    # 주의: redis 자체 maxmemory 는 걸지 않는다. 지금 이 안에 아직 DB 로 안 내려간 시청
    # 진행률이 들어 있어서, evict 가 곧 데이터 유실이다. 컨테이너 상한만으로 봉쇄한다.
    mem_limit: 512m
    cpus: 1.0   # 명령 처리는 단일 스레드라 1.0 이면 충분

  postgres: # PostgreSQL 데이터베이스 서비스
    environment:
      # 프로덕션 데이터베이스 설정
      POSTGRES_DB: ott_project_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # 환경변수 사용 권장
    volumes:
      # 같은 컨테이너 경로를 덮어써서 initdb 스크립트를 러너 작업폴더 밖에서 읽는다.
      # (도커 데스크톱의 bind mount 는 데스크톱 계정 권한으로 열리는데, 러너 작업폴더에는
      #  평문 .env 가 있어 그 계정에 읽기를 줄 수 없다. 원본 docker-compose.yml 은 개발과
      #  공용이라 수정하지 않으므로, 이 파일을 빼면 즉시 원상복구된다 — ha.yml 의 nginx 와 같은 방식)
      # postgres_data 는 base 의 정의가 병합돼 그대로 남는다(컨테이너 경로가 달라 대체되지 않음).
      - C:/ott-deploy/config/security/initdb:/docker-entrypoint-initdb.d:ro
    # [SECURITY 2026-07-31] postgres:15 entrypoint 가 root 로 하는 일:
    #   chmod 00700 "$PGDATA" / chmod 03775 /var/run/postgresql  → FOWNER (남의 소유 파일 chmod)
    #   find "$PGDATA" \! -user postgres -exec chown postgres    → CHOWN
    #   위 경로들은 postgres 소유라 root 가 접근하려면                → DAC_OVERRIDE
    #   exec gosu postgres "$BASH_SOURCE"                        → SETUID, SETGID
    # initdb(빈 볼륨) 경로까지 커버하는 집합이다. 기존 볼륨으로 뜰 때는 이보다 덜 쓴다.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # 현재 63MB. 커넥션은 최대 40개(Hikari 20 × 인스턴스 2)이고 shared_buffers 는 기본 128MB.
    # 파일 캐시도 cgroup 사용량에 잡히지만 압박이 오면 커널이 먼저 회수하므로 OOM 원인이
    # 되지 않는다 — postgres 에 상한을 거는 걸 겁낼 이유가 여기에 없다.
    mem_limit: 2g
    cpus: 2.0   # autovacuum·체크포인터 몫 포함. 부하시험에서 DB 는 병목이 아니었다(커넥션 1~2/20)

  kafka: # Kafka 브로커(KRaft 단일 노드)
    # [SECURITY 2026-07-31] apache/kafka:3.7.0 은 이미지가 이미 USER appuser(비root)로
    # 뜨고(docker inspect .Config.User=appuser), 리스너 포트 9092/9093/9094 가 전부
    # 1024 이상이라 되돌릴 capability 가 하나도 없다. 순수 cap_drop: ALL.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 현재 468MB 로 이 파일에서 여유 배수가 가장 낮다(6.6배). JVM 이라 힙 밖(메타스페이스·
    # 다이렉트 버퍼)이 같이 붙기 때문이다. 로그 세그먼트 페이지 캐시는 회수 가능해서 상한을
    # 밀어올리지 않는다. 나중에 상한 관련 문제가 난다면 여기가 1순위다.
    mem_limit: 3g
    cpus: 2.0

  rabbitmq: # RabbitMQ 브로커
    # [SECURITY 2026-07-31] rabbitmq:3.13-management entrypoint 가 root 로 하는 일:
    #   find /var/lib/rabbitmq \! -user rabbitmq -exec chown rabbitmq  → CHOWN (+DAC_OVERRIDE:
    #     /var/lib/rabbitmq 는 rabbitmq 소유 볼륨이라 root 가 탐색·수정하려면 필요)
    #   exec gosu rabbitmq "$BASH_SOURCE"                              → SETUID, SETGID
    # AMQP 5672 / management 15672 둘 다 1024 이상 → NET_BIND_SERVICE 불필요.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # 현재 152MB. 던닝 지연 큐라 적재량 자체가 작다.
    mem_limit: 1g
    cpus: 1.0
    # 위 mem_limit 과 한 쌍이다. 이 브로커는 cgroup 상한을 못 읽고 호스트 메모리를 기준으로
    # 워터마크를 잡아서(실측: 6.21GiB) 상한 1g 를 훨씬 넘긴 지점에서야 자기 보호가 작동한다.
    # 그대로 두면 flow control 로 버티는 대신 OOM 으로 죽는다. 근거와 확인법은 파일 안에 있다.
    volumes:
      - C:/ott-deploy/config/rabbitmq/10-memory.conf:/etc/rabbitmq/conf.d/10-memory.conf:ro

  nginx: # Nginx 리버스 프록시
    # 프로덕션용 nginx 설정 (필요시 별도 설정 파일 사용)
    volumes:
      - C:/ott-deploy/config/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    # [SECURITY 2026-07-31] nginx 는 root 마스터로 뜨는 쪽을 유지한다.
    # PLATFORM 2절 [상황] "리버스 프록시를 비root로 실행한다"의 미적용 조건에 해당:
    # 컨테이너 내부에서 80/443 을 직접 듣고 있고 certbot 볼륨(/etc/letsencrypt)을 읽어야 해서
    # unprivileged 이미지로 옮기는 비용이 크다. 규칙이 지시하는 대체 수단(capability 제거 +
    # no-new-privileges)을 적용하고 그 판단을 여기 기록한다.
    #
    # 되돌리는 capability 와 근거:
    #   NET_BIND_SERVICE — listen 80/443 (nginx.prod.conf). cap_drop:ALL 을 하면 root 라도
    #                      1024 미만 바인딩이 막혀 "bind() to 0.0.0.0:80 failed (13)" 로 죽는다.
    #   SETUID, SETGID   — 마스터가 워커를 nginx 유저로 내려서 띄운다(빌드 옵션 --user=nginx).
    #   CHOWN            — 기동 시 ngx_create_paths() 가 /var/cache/nginx/* 를 워커 유저 소유로 맞춘다.
    #   DAC_OVERRIDE     — 위 캐시 경로가 nginx 소유라 root 마스터가 접근하려면 필요.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # 현재 16MB. 프록시라 상주 메모리가 거의 늘지 않는다.
    # CPU 를 1.5 로 다른 인프라보다 넉넉히 준 이유: 실제 비용은 TLS 종료인데 부하시험이
    # nginx 를 우회한 경로(BACKENDS 직결)로 측정돼서 이 구간만 실측이 없다. 공개 진입점이라
    # 여기서 스로틀이 걸리면 전체가 느려지므로 미실측 구간은 넉넉한 쪽으로 잡는다.
    mem_limit: 256m
    cpus: 1.5

volumes:
  certbot-etc:
    external: true
    name: certbot-etc
  certbot-webroot:
    external: true
    name: certbot-webroot
# application.yml (기본 설정 파일)
spring:
  profiles:
    active: dev # 개발 환경 프로파일 활성화
  task:
    scheduling:
      pool:
        # 기본값 1이면 @Scheduled 7개가 스레드 하나를 공유해, 하나가 늦으면 나머지가 전부 밀린다.
        # 실측(2026-08-13, 보존 15일): OutboxPublisher 가 14.18초를 점유한 사건이 2회 있었다.
        # 둘 다 postgres 컨테이너 재생성 뒤 죽은 커넥션을 회수하느라 걸린 시간이고, 그동안
        # 10초 주기 진행률 반영은 돌지 못했다(loadtest/RESULTS.md 참고).
        # 5 = 오래 걸릴 수 있는 3개(결제 대사 2개 + 정기결제) + 상시 2개(아웃박스 2초, 진행률 10초).
        # 겹쳐 돌아도 안전하다: 각 작업은 ShedLock 으로 인스턴스 간 배타가 걸려 있고, 자기 자신과는
        # fixedDelay 특성상 겹치지 않으며, 서로 다른 작업의 동시 실행은 이미 요청 스레드 200개가
        # 같은 테이블에 만들고 있는 동시성과 같은 종류다.
        size: 5
  jpa:
    # OSIV 비활성화. 켜두면 요청이 끝날 때까지 영속성 컨텍스트와 커넥션을 붙잡고,
    # 지연 로딩이 컨트롤러/직렬화 단계에서 조용히 쿼리를 날린다(로딩 경계가 코드에 안 드러남).
    # 끄면 엔티티를 어디까지 로딩해 넘길지 서비스에서 명시하게 된다.
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 N+1 완화. 연관 엔티티를 건별로 조회하지 않고 최대 100건씩 IN 절로 묶는다.
        # prod 의 jdbc.batch_size(쓰기 배치)와는 다른 설정 — 이건 읽기 쪽이다.
        default_batch_fetch_size: 100
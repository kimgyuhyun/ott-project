// Flyway 10 은 DB 지원이 모듈로 분리돼 있다. Flyway Gradle 플러그인은 자기 buildscript
// 클래스패스에서 드라이버와 DB 모듈을 찾으므로, 여기 없으면 접속을 시도하지도 못하고
// "No database found to handle jdbc:postgresql://..." 로 실패한다.
// (프로젝트의 runtimeOnly 나 flyway.configurations 로는 플러그인 클래스패스에 닿지 않는다)
buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath 'org.flywaydb:flyway-database-postgresql:10.22.0'
		classpath 'org.postgresql:postgresql:42.7.13'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.spotbugs' version '6.5.11'
	id 'com.diffplug.spotless' version '7.2.1'
	// 마이그레이션 검증 전용. 애플리케이션 런타임과는 무관하며 CI 잡에서만 쓴다.
	id 'org.flywaydb.flyway' version '10.22.0'
}

group = 'com.ottproject'
version = '0.0.1-SNAPSHOT'

// [SECURITY 2026-06-24] Trivy CRITICAL 게이트 통과용 보안 패치.
// Spring Boot 3.5.4 기본 관리버전을 보안 수정본으로 상향(동일 minor라 호환):
//   tomcat-embed-core 10.1.43 -> 10.1.55  (CVE-2026-41293 / -43512 / -43515)
//   spring-security    6.5.2  -> 6.5.9   (CVE-2026-22732)
ext['tomcat.version'] = '10.1.55'
ext['spring-security.version'] = '6.5.9'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// 의존성 락.
// 버전을 비워둔 선언(Boot 의 dependency-management 가 관리)과 동적 버전이 섞여 있어,
// 락이 없으면 같은 커밋이 빌드 시점에 따라 다른 의존성으로 해석된다.
// 락 파일(gradle.lockfile)은 커밋하고, CI 는 --write-locks 없이 실행한다.
// 해석 결과가 락과 다르면 빌드가 실패한다 — 그게 이 설정의 목적이다.
// 버전을 올릴 때만 로컬에서 ./gradlew dependencies --write-locks 로 갱신한다.
dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 세션을 Redis 에 저장하여 재배포/다중 인스턴스에서도 세션 유지 (톰캣 인메모리 세션 대체)
	implementation 'org.springframework.session:spring-session-data-redis'
	// Kafka: 결제 성공 이후 부수효과(알림/통계/추천)를 아웃박스→카프카로 비동기 분리
	implementation 'org.springframework.kafka:spring-kafka'
	// RabbitMQ: 정기결제 실패 재시도를 지연 큐(TTL+DLX)로 건별 스케줄링
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Micrometer Prometheus 레지스트리: /actuator/prometheus 로 앱 지표(요청수/지연/JVM)를 노출.
	// Prometheus 가 이 엔드포인트를 긁어 무중단 배포/다중 인스턴스 동작을 그래프로 관측한다.
	// 버전은 Boot 3.5.4 의 dependency-management 가 관리한다.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	// Loki logback appender: 앱이 자기 로그를 Loki 로 직접 푸시(도커 소켓/특권 없이 관측성 확보).
	// logback-spring.xml 의 LOKI appender(prod 프로파일)에서만 사용, dev 는 NOP 로 무력화.
	implementation 'com.github.loki4j:loki-logback-appender:1.6.0'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	implementation 'org.flywaydb:flyway-core:10.22.0'
	implementation 'org.flywaydb:flyway-database-postgresql:10.22.0'

	// ShedLock: @Scheduled 배치의 다중 인스턴스 중복 실행 방지(분산락).
	// 인스턴스 2개 실험에서 아웃박스 이벤트 50건이 카프카에 100건으로 실리는 것을 확인했다.
	// 저장소는 이미 쓰고 있는 Redis 를 재사용한다(세션 저장소와 동일 인스턴스, 키 네임스페이스만 분리).
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.16.0'

	// 엔티티→DTO 매핑 라이브러리는 쓰지 않는다.
	// 읽기는 MyBatis 가 SQL 결과를 DTO 로 바로 채우므로 변환 지점이 애초에 거의 없고,
	// 남은 몇 개는 DTO 의 정적 팩토리(Dto.from(entity))로 처리한다.
	// (과거 MapStruct 를 썼으나 매퍼 1개·호출 2곳뿐이라 애노테이션 프로세서 비용만 남아 제거했다)

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// QueryDSL (jakarta) — 관리자 애니 큐레이션의 동적 검색/벌크 수정에만 사용한다.
	// 사용자향 읽기는 MyBatis, 일반 쓰기는 JPA 를 그대로 유지한다(경계는 CLAUDE 문서 참고).
	// 버전을 비운 것은 의도적이다: Boot 3.5.4 의 dependency-management 가 querydsl.version 을 관리한다.
	// ':: jakarta' 표기는 "버전 생략 + classifier=jakarta" 를 뜻한다(jakarta.persistence 기반 Q 클래스 생성).
	// Q 클래스는 build/generated/sources/annotationProcessor/java/main 에 생성된다
	// (Boot 기본 경로라 별도 sourceSets 설정이 필요 없고, clean 으로 함께 지워진다).
	implementation 'com.querydsl:querydsl-jpa::jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// SpringDoc OpenAPI (Swagger) - Boot 3.5.x 호환 버전으로 상향
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	testImplementation 'com.h2database:h2' // 테스트용 인메모리 DB

	// Testcontainers: 운영과 같은 PostgreSQL 을 띄워 DB 방언에 의존하는 동작을 검증한다.
	// H2 로는 못 잡는 것들이 있다 — 예: read-only 트랜잭션의 SELECT ... FOR UPDATE 거부.
	// (H2 는 이를 허용해서, 큐레이션 단건 조회 500 이 슬라이스 테스트를 전부 통과하고 배포까지 갔다.)
	// 버전을 비운 것은 의도적이다: Boot 3.5.4 의 dependency-management 가 testcontainers BOM 을 관리한다.
	// Docker 가 필요하다 — 없는 환경에서는 해당 테스트가 skip 된다(DockerAvailable 조건 참고).
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

// Lombok 을 컴파일 전용 의존성으로도 잡아주는 설정
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

// 마이그레이션 검증.
// 모든 테스트가 flyway.enabled=false 로 돌기 때문에, Flyway 가 실제로 처음 실행되는 곳이
// CD 의 운영 DB 였다. 마이그레이션이 깨져 있어도 배포 시점에야 알게 된다는 뜻이다.
// CI 가 빈 Postgres 에 전량 적용(flywayMigrate)한 뒤 체크섬·순서를 검증(flywayValidate)한다.
// 접속 정보는 CI 잡이 환경변수로 준다. 기본값은 로컬에서 손으로 돌릴 때를 위한 것이다.
// CREATE INDEX CONCURRENTLY 를 쓰는 마이그레이션 때문에 필요하다.
// Flyway 는 기본적으로 별도 커넥션에서 flyway_schema_history 를 SELECT ... FOR UPDATE 로
// 잠그고 그 트랜잭션을 마이그레이션이 끝날 때까지 연다. CONCURRENTLY 는 열려 있는 모든
// 트랜잭션이 끝나기를 기다리므로, 그 둘이 서로를 기다려 영원히 멈춘다(실측: 30분 무진행).
// false 로 두면 트랜잭션 대신 세션 어드바이저리 락을 쓴다 — 인스턴스 간 배타는 그대로다.
// Gradle 플러그인은 이 키를 DSL 로 받지 않아 시스템 프로퍼티로 넘긴다.
System.setProperty('flyway.postgresql.transactional.lock', 'false')

flyway {
	url = System.getenv('FLYWAY_URL') ?: 'jdbc:postgresql://localhost:5432/ott_ci'
	user = System.getenv('FLYWAY_USER') ?: 'ci'
	password = System.getenv('FLYWAY_PASSWORD') ?: 'ci'
	locations = ['filesystem:src/main/resources/db/migration']
}

// 포매터(Spotless).
// palantir-java-format 을 쓴다. google-java-format 과 같은 "옵션 없음" 계열이라 설정을
// 다시 논의할 여지가 없고, 빌더·스트림 체인 줄바꿈이 이 코드베이스의 손글씨에 더 가깝다.
//
// 전 파일을 검사한다. 예전에는 ratchetFrom 'origin/main' 으로 "건드린 파일만" 검사해
// 일괄 재작성을 피했지만, Spotless 의 포맷 단위가 파일 전체라서 옛 파일을 한 줄만 고쳐도
// 그 파일이 통째로 다시 쓰였다(실측: 5줄 수정 -> 57+/59- diff). 게다가 main 에 직접 push
// 하면 HEAD 와 origin/main 이 같아 검사 대상이 0건이 되어 게이트가 조용히 통과했다.
// 그래서 프론트(Prettier)와 같은 방식으로 한 번에 일괄 적용하고 ratchet 을 걷어냈다.
// 일괄 포맷 커밋은 .git-blame-ignore-revs 에 등록해 blame 에서 건너뛴다.
// spotlessCheck 는 check 에 붙으므로 CI 의 clean build 가 자동으로 실행한다.
spotless {
	java {
		palantirJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		// 생성된 Q 클래스는 build/ 아래라 애초에 소스셋 밖이다. 별도 제외가 필요 없다.
	}
}

// 정적 분석(SpotBugs).
// 스타일·성능류 지적은 리포트만 남기고 빌드를 막지 않는다 — PLATFORM.md 7절 [상황]이
// 코드 스타일을 경고로 두라고 한다. 여기서 전부 차단으로 두면 지적 하나에 파이프라인이
// 멈추고, 그러면 결국 게이트를 통째로 끄게 된다.
// 보안 범주만 차단한다. 판정은 CI 의 check-spotbugs-security.sh 가 XML 리포트를 읽어서 한다.
spotbugs {
	ignoreFailures = true
}

// SpotBugs 도구 클래스패스는 Boot 의 dependency-management 관리에서 떼어낸다.
// 관리 버전(3.17.0)이 spotbugs 구성까지 strictly 로 눌러서, SpotBugs 4.10 이 요구하는
// org.apache.commons.lang3.Strings 가 없는 채로 실행됐다. 그러면 분석이 NoClassDefFoundError
// 로 죽는데 SpotBugs 는 <Errors errors="0"> 짜리 빈 리포트를 그대로 남긴다.
// 지적 0건과 구분이 안 되므로 게이트가 조용히 통과한다. 실제로 그렇게 통과하고 있었다.
// force 로는 안 된다. dependency-management 는 해석 시점에 eachDependency 로 버전을 다시 쓰고,
// 그게 force 보다 나중에 돌아 되돌려 놓는다. 같은 방식으로, 더 나중에 등록해 덮는다.
configurations.named('spotbugs') {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
			details.useVersion '3.20.0'
			details.because 'SpotBugs 4.10 needs org.apache.commons.lang3.Strings (absent in the Boot-managed 3.17.0)'
		}
	}
}

spotbugsMain {
	excludeFilter = file('config/spotbugs-exclude.xml')
	reports {
		xml.required = true
		html.required = true
	}
}

// 테스트 코드는 운영 산출물이 아니므로 분석 대상에서 뺀다.
spotbugsTest {
	enabled = false
}

// JUnit 5(Jupiter) 실행 설정
// 주의: 이 블록이 없으면 Gradle 이 기본 JUnit4 실행기를 사용해 org.junit.jupiter 테스트를 조용히 건너뛴다.
// 컴파일만 되고 실행 0건인데 BUILD SUCCESSFUL 이 떠서 테스트가 도는 줄 착각하게 되므로 반드시 유지할 것.
test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed" // 실행 결과를 로그로 남겨 CI 에서 확인 가능하게
	}
	// 전체 컨텍스트 테스트는 여기서 빼고 아래 contextTest 가 별도 JVM 으로 돌린다. 이유는 그 태스크 주석 참고.
	filter {
		excludeTestsMatching 'com.ottproject.ottbackend.ApplicationContextLoadsTest'
	}
}

// 전체 컨텍스트를 띄우는 테스트 전용 태스크. 분리한 이유는 격리가 아니라 오염 때문이다.
// @SpringBootTest 는 JpaAuditingConfig 를 함께 올리는데, @EnableJpaAuditing 이 끌어오는
// AnnotationBeanConfigurerAspect 는 aspectOf() 싱글턴이라 JVM 전역이고 BeanFactory 참조를
// static 으로 붙든다. 스프링 테스트 컨텍스트는 캐싱되어 닫히지 않으므로 그 참조가 계속 살아남고,
// 그 뒤에 도는 슬라이스는 Auditing 을 켠 적이 없는데도 AuditingEntityListener 가 붙어
// @CreatedDate 를 저장 시각으로 덮어쓴다(JpaSliceTestSupport 주석의 경고와 같은 현상).
// 실측: UserRepositorySignupCountTest 가 픽스처에 심은 과거 가입 시각이 now() 로 덮여
// 집계 범위를 벗어나면서 2건이 깨졌다(CI 32637244146, 로컬 재현 동일).
// 같은 JVM 안에서는 실행 순서를 바꿔도 해결되지 않는다 — 오염이 JVM 전역이기 때문이다.
// 그래서 태스크를 나눠 JVM 을 분리한다. 어느 쪽 테스트도 약화시키지 않는 유일한 방법이다.
tasks.register('contextTest', Test) {
	description = 'Runs the full-context test in its own JVM (see comment: JVM-wide auditing pollution).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.ottproject.ottbackend.ApplicationContextLoadsTest'
	}
	testLogging {
		events "passed", "skipped", "failed"
	}
}

// check 에 붙여 CI 의 clean build 가 자동으로 실행하게 한다. 붙이지 않으면 아무도 돌리지 않는다.
check.dependsOn 'contextTest'

// 편집 직후 되먹임용 빠른 테스트. CI 와 test 태스크는 그대로 전량 실행한다 — 커버리지는 줄이지 않는다.
// Testcontainers 를 쓰는 13개 클래스(@Tag("testcontainers"))만 뺀다. 실측으로 전량 104초,
// 여기 남는 88개 클래스는 28초다. 차이는 전부 클래스마다 PostgreSQL 컨테이너를 새로 띄우는 값이다.
// (한때 이 13개가 520초였다. 대부분이 검증이 아니라 종료 시 커넥션 타임아웃 대기였고, 그건
//  ddl-auto 를 create 로 바꿔 없앴다 — 각 테스트 클래스의 @TestPropertySource 주석 참고)
tasks.register('testFast', Test) {
	description = 'Runs every test except the Testcontainers-backed ones.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		excludeTags 'testcontainers'
	}
}
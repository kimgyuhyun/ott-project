# 백엔드 2인스턴스(무중단 배포)용 오버레이 — 2026-07-20
#
# 반드시 prod + netlock 뒤에 붙여서 쓴다:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.netlock.yml -f docker-compose.ha.yml up -d
# 정식 절차는 deploy-rolling.ps1 을 쓸 것. 맨손으로 up 하면 두 인스턴스가 동시에
# 재생성되어 무중단이 깨진다(실측: 동시 재기동 시 197요청 중 164건 502).
#
# 안전장치: 이 파일은 netlock 에서만 정의되는 네트워크(proxy)를 참조한다. netlock 을 빼고
# 실행하면 "network proxy not found" 로 즉시 실패한다 → netlock 누락 배포가 원천 차단된다.
#
# 왜 extends 를 쓰나:
#   app2 의 환경변수/보안설정을 손으로 복사하면 나중에 app 에만 변수를 추가했을 때
#   app2 가 조용히 뒤처진다. prod 의 app 정의를 그대로 상속받아 그 함정을 없앤다.
#   (검증: docker compose config 로 app 과 app2 의 environment 를 diff 하면 같아야 한다)

services:
  # 2번째 백엔드 인스턴스
  app2:
    extends:
      file: docker-compose.prod.yml
      service: app          # prod 의 image/env_file/environment/보안하드닝/리소스상한을 전부 상속
    container_name: ott-app-2
    restart: unless-stopped
    # base 의 x-logging 앵커는 파일을 넘어가지 않고, extends 는 prod.yml 의 app 을
    # 상속하므로 base 에 붙인 로그 회전이 app2 에는 딸려오지 않는다. 여기서 같은 값을 준다.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    pull_policy: ${APP_PULL_POLICY:-never}   # netlock 의 app 설정과 동일하게 맞춘다
    depends_on:
      - postgres
      - redis
      - kafka
      - rabbitmq
    environment:
      # base(docker-compose.yml)에만 있고 prod 에는 없는 항목이라 여기서 보충한다.
      # (app 과 app2 의 environment 가 완전히 같아야 한다 — 아래 명령으로 검증 가능)
      #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
      #     -f docker-compose.netlock.yml -f docker-compose.ha.yml config --format json
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-ott-kafka:9094}
      SECURE_LINK_SECRET: ${SECURE_LINK_SECRET:-}
      LOKI_INSTANCE: ott-app-2   # prod.yml(app=ott-app) override — Loki 로그에서 인스턴스 구분용
      # [SECURITY 2026-08-07] 아웃바운드 프록시 설정. netlock.yml 의 app 에만 있고 prod 에는
      # 없는 항목이라(extends 는 prod 를 상속한다) 여기서 보충한다. 위 두 줄과 같은 이유다.
      # 빠지면 app2 만 프록시 망에 있으면서 프록시를 쓸 줄 몰라 아웃바운드가 통째로 죽는다.
      # netlock.yml 의 값과 반드시 글자까지 같아야 한다 — 파일 상단의 config diff 로 검증할 것.
      JAVA_TOOL_OPTIONS: "-Dhttp.proxyHost=ott-egress-proxy -Dhttp.proxyPort=3128 -Dhttps.proxyHost=ott-egress-proxy -Dhttps.proxyPort=3128 -Dhttp.nonProxyHosts=localhost|127.*|[::1]|loki|prometheus|grafana|ott-*"
      MAIL_SOCKS_HOST: ott-smtp-proxy
      MAIL_SOCKS_PORT: "1080"
    # [SECURITY 2026-08-07] 루프백 포트(127.0.0.1:8093) 공개를 제거했다. 백엔드가 egress 에서
    # 빠지면서 internal 망에만 붙게 됐고, 그런 컨테이너는 호스트 포트를 공개할 수 없다
    # (PLATFORM 3절. 실측: docker port ott-app 이 빈 출력). 남겨두면 있지도 않은 디버깅
    # 포트를 있는 것처럼 적어두는 셈이라 지운다.
    # 롤링 배포의 인스턴스별 헬스 확인은 deploy-rolling.ps1 이 nginx 에서 컨테이너 이름으로
    # 조회하는 방식으로 바뀌었다 — 어느 인스턴스가 답했는지는 그대로 알 수 있다.
    networks:
      # netlock 의 app 과 반드시 동일해야 한다. 여기는 extends 로 상속되지 않는 부분이라,
      # 빼먹으면 app2 만 조용히 옛 배선(직접 아웃바운드)으로 남는다.
      # [SECURITY 2026-08-07] egress → proxy. 아웃바운드는 프록시 경유만.
      - default
      - data
      - proxy

  nginx:
    volumes:
      # 같은 마운트 지점을 덮어써서 upstream 이 있는 HA 설정을 쓴다.
      # 원본 nginx.prod.conf 는 수정하지 않으므로, 이 파일을 빼면 즉시 원상복구된다.
      - C:/ott-deploy/config/nginx/nginx.prod.ha.conf:/etc/nginx/conf.d/default.conf:ro

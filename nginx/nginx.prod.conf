# [2026-07-28] 주의: Docker Desktop 의 포트 퍼블리싱이 출발지 IP 를 SNAT 하므로
# $binary_remote_addr 는 항상 도커 브리지 게이트웨이(172.19.0.1) 하나로 수렴한다.
# 따라서 아래 zone 들은 "클라이언트별 제한"이 아니라 사실상 "서비스 전체 총량 제한"이다.
# 이름에 global_ 을 붙인 이유이며, 실 IP 복원(Cloudflare 또는 PROXY protocol) 전까지 유지된다.
#
# auth: 계정 단위 남용 방어는 LoginAttemptService(이메일 기준 5회/15분 잠금)와 Turnstile 이
#       이미 담당하므로, 여기서는 폭주 방지 상한 역할만 한다.
# payment: auth 와 같은 버킷을 쓰면 스캐너가 로그인을 긁을 때 결제 콜백까지 429 로 유실되므로
#       반드시 분리한다.
limit_req_zone $binary_remote_addr zone=global_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=global_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=global_payment:10m rate=10r/s;
# 차단 응답은 429(기본값 503 아님). 503 은 "서버 장애"라 리밋 발동과 실제 장애가
# 로그·알람에서 구분되지 않는다.
limit_req_status 429;

# [SECURITY 2026-08-07] 응답 헤더와 에러 페이지에서 nginx 버전을 숨긴다.
# 버전이 보이면 스캐너가 그 버전에 걸리는 알려진 취약점만 골라 시도할 수 있다.
# 패치를 대신하지는 못하고 표적 선정을 어렵게 하는 정도의 효과다.
# 이 파일은 conf.d/default.conf 로 마운트되어 http 컨텍스트 안에 include 되므로
# 여기(top-level)에 두면 모든 server 블록에 적용된다. 같은 이유로 nginx.prod.ha.conf
# 에도 동일하게 넣어야 한다 — 롤링 배포는 그쪽 파일을 쓴다.
server_tokens off;

# X-Forwarded-For 는 $proxy_add_x_forwarded_for(클라이언트가 보낸 헤더 뒤에 이어붙임)를 쓰지 않는다.
# 백엔드 ClientRequestUtil 이 XFF 의 첫 값을 신뢰하므로, 이어붙이면 외부에서
# X-Forwarded-For 헤더를 달아 감사 로그의 접속 IP 를 위조할 수 있다.
# 항상 nginx 가 직접 관측한 $remote_addr 만 내려보낸다.

# [SECURITY 2026-07-18] IP 직접 접근·이상 Host/SNI 드롭(default_server).
# 정상 트래픽은 server_name laputa.kozow.com 으로만 매칭된다. Host 가 안 맞는
# 스캐너/봇/IP 직접 요청은 응답 없이 커넥션만 끊는다(444). 실제 도메인 요청은
# 아래 named server 로 정상 라우팅되므로 ACME 갱신·정상 접속에는 영향이 없다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    # 443 은 TLS 핸드셰이크가 먼저이므로, 매칭되지 않는 SNI 는 인증서 없이 핸드셰이크를 거부한다.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name laputa.kozow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot; # certbot 웹루트
    }

    location / {
        return 301 https://laputa.kozow.com$request_uri; # 고정 도메인으로 리다이렉트
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name laputa.kozow.com;
    http2 on;

    # [SECURITY 2026-07-18] 요청 본문 상한(대용량 페이로드 남용/메모리 소모 차단).
    # Spring 기본 max-request-size(10MB)에 맞춰 초과 요청은 nginx 에서 조기 413 처리.
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP는 Next(next.config.ts headers)에서만 — nginx 이중 헤더 시 frame-src 없는 정책과 충돌함
    ssl_certificate /etc/letsencrypt/live/laputa.kozow.com/fullchain.pem; # 실제 도메인으로 교체
    ssl_certificate_key /etc/letsencrypt/live/laputa.kozow.com/privkey.pem; # 실제 도메인으로 교체
    ssl_session_timeout 1d; # 기본 TLS 설정
    ssl_protocols TLSv1.2 TLSv1.3; # 안전한 프로토콜만 허용
    ssl_ciphers HIGH:!aNULL:!MD5; # 안전한 사이퍼
    ssl_prefer_server_ciphers on;

    # Actuator 헬스체크 (UptimeRobot 모니터링용)
    location /actuator/health {
        proxy_pass http://ott-app:8090/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 프론트 정적/SSR 프록시
    location / {
        limit_req zone=global_general burst=50 nodelay;
        proxy_pass http://ott-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Next.js 개발 서버를 위한 설정
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        
        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 인증/회원가입 API (엄격한 제한)
    location /api/auth/ {
        limit_req zone=global_auth burst=20 nodelay;
        proxy_pass http://ott-app:8090/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 결제 API (엄격한 제한)
    location /api/payment/ {
        limit_req zone=global_payment burst=20 nodelay;
        proxy_pass http://ott-app:8090/api/payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 관리자 애니 동기화 (장시간 작업 전용 타임아웃)
    # Jikan API 를 초당 1회(max-rps: 1.0)로만 호출하므로 50개만 수집해도 1분을 넘긴다.
    # nginx 기본 proxy_read_timeout(60초)에 걸려 504 Gateway Time-out 이 나므로 이 경로만 늘린다.
    # 주의: /api/ 전체를 늘리면 모든 API 요청이 장시간 커넥션을 점유할 수 있어 경로를 한정한다.
    # (수천 개 단위 수집은 이 타임아웃도 넘길 수 있음 → 그 규모는 비동기 처리가 필요)
    location /api/admin/anime/ {
        limit_req zone=global_general burst=20 nodelay;
        proxy_pass http://ott-app:8090/api/admin/anime/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;   # 수집 완료까지 대기(약 500개 규모까지 커버)
        proxy_send_timeout 600s;
    }

    # 백엔드 API 프록시 (일반 제한)
    location /api/ {
        limit_req zone=global_general burst=20 nodelay;
        proxy_pass http://ott-app:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 주의: /oauth2/success, /oauth2/failure 는 프론트 라우팅이므로 기본 location / 으로 처리

    # OAuth2 콜백 프록시 (Spring Security 기본 콜백 경로)
    location /login/oauth2/ {
        proxy_pass http://ott-app:8090/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

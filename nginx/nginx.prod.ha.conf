# 프로덕션 nginx 설정 — 백엔드 2인스턴스(무중단 배포)용
#
# nginx.prod.conf 와의 차이는 딱 두 가지다:
#   1) upstream ott_backend 블록 추가 (ott-app + ott-app-2)
#   2) 백엔드로 가던 proxy_pass 대상을 ott-app:8090 → ott_backend 로 변경
#      + proxy_next_upstream (재기동 중인 인스턴스로 간 요청을 살아있는 쪽으로 재시도)
# 나머지(444 드롭, TLS, 레이트리밋, 보안헤더, 타임아웃)는 원본과 동일하다.
#
# 2026-07-20 실험 스택(-p ott-multi, 포트 8888)에서 검증한 설정:
#   - 순차 교체 중 374요청 실패 0
#   - 동시 재기동(대조군)은 197요청 중 164건 502  → 재시도 설정이 핵심이다
#
# 적용:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.netlock.yml -f docker-compose.ha.yml up -d
#   (docker-compose.ha.yml 이 이 파일을 마운트한다. 원본 nginx.prod.conf 는 그대로 둔다.)

# [2026-07-28] 주의: Docker Desktop 의 포트 퍼블리싱이 출발지 IP 를 SNAT 하므로
# $binary_remote_addr 는 항상 도커 브리지 게이트웨이(172.19.0.1) 하나로 수렴한다.
# 따라서 아래 zone 들은 "클라이언트별 제한"이 아니라 사실상 "서비스 전체 총량 제한"이다.
# 이름에 global_ 을 붙인 이유이며, 실 IP 복원(Cloudflare 또는 PROXY protocol) 전까지 유지된다.
#
# auth: 계정 단위 남용 방어는 LoginAttemptService(이메일 기준 5회/15분 잠금)와 Turnstile 이
#       이미 담당하므로, 여기서는 폭주 방지 상한 역할만 한다.
# payment: auth 와 같은 버킷을 쓰면 스캐너가 로그인을 긁을 때 결제 콜백까지 429 로 유실되므로
#       반드시 분리한다.
limit_req_zone $binary_remote_addr zone=global_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=global_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=global_payment:10m rate=10r/s;
# 차단 응답은 429(기본값 503 아님). 503 은 "서버 장애"라 리밋 발동과 실제 장애가
# 로그·알람에서 구분되지 않는다.
limit_req_status 429;

# [SECURITY 2026-08-07] 응답 헤더와 에러 페이지에서 nginx 버전을 숨긴다.
# 버전이 보이면 스캐너가 그 버전에 걸리는 알려진 취약점만 골라 시도할 수 있다.
# 패치를 대신하지는 못하고 표적 선정을 어렵게 하는 정도의 효과다.
# nginx.prod.conf 와 동일하게 유지할 것 — 배포 경로(단일/롤링)에 따라 응답 헤더가
# 달라지면 안 된다.
server_tokens off;

# X-Forwarded-For 는 $proxy_add_x_forwarded_for(클라이언트가 보낸 헤더 뒤에 이어붙임)를 쓰지 않는다.
# 백엔드 ClientRequestUtil 이 XFF 의 첫 값을 신뢰하므로, 이어붙이면 외부에서
# X-Forwarded-For 헤더를 달아 감사 로그의 접속 IP 를 위조할 수 있다.
# 항상 nginx 가 직접 관측한 $remote_addr 만 내려보낸다.

# 백엔드 인스턴스 풀.
# max_fails=1 fail_timeout=5s: 한 번 실패하면 5초간 해당 인스턴스를 건너뛴다.
# 스티키(ip_hash)를 쓰지 않는 이유: 세션이 Redis 에 있어 어느 인스턴스로 가도 되기 때문.
upstream ott_backend {
    server ott-app:8090   max_fails=1 fail_timeout=5s;
    server ott-app-2:8090 max_fails=1 fail_timeout=5s;
}

# [SECURITY 2026-07-18] IP 직접 접근·이상 Host/SNI 드롭(default_server).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name laputa.kozow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot; # certbot 웹루트
    }

    location / {
        return 301 https://laputa.kozow.com$request_uri; # 고정 도메인으로 리다이렉트
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name laputa.kozow.com;
    http2 on;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP는 Next(next.config.ts headers)에서만 — nginx 이중 헤더 시 frame-src 없는 정책과 충돌함
    ssl_certificate /etc/letsencrypt/live/laputa.kozow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laputa.kozow.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # [HA] 업스트림 인스턴스가 죽었거나 재기동 중이면 다음 인스턴스로 재시도한다.
    # 이 설정이 없으면 인스턴스를 2개 띄워도 롤링 중 일부 요청이 그대로 502 를 받는다.
    # server 레벨에 한 번만 선언해 아래 모든 location 에 상속시킨다.
    # (ott-frontend 는 upstream 그룹이 아니라 단일 서버이므로 영향받지 않는다.)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;

    # Actuator 헬스체크 (UptimeRobot 모니터링용)
    location /actuator/health {
        proxy_pass http://ott_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 프론트 정적/SSR 프록시 (단일 인스턴스 — 변경 없음)
    location / {
        limit_req zone=global_general burst=50 nodelay;
        proxy_pass http://ott-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 인증/회원가입 API (엄격한 제한)
    location /api/auth/ {
        limit_req zone=global_auth burst=20 nodelay;
        proxy_pass http://ott_backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 결제 API (엄격한 제한)
    location /api/payment/ {
        limit_req zone=global_payment burst=20 nodelay;
        proxy_pass http://ott_backend/api/payment/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 관리자 애니 동기화 (장시간 작업 전용 타임아웃)
    location /api/admin/anime/ {
        limit_req zone=global_general burst=20 nodelay;
        proxy_pass http://ott_backend/api/admin/anime/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;   # 수집 완료까지 대기(약 500개 규모까지 커버)
        proxy_send_timeout 600s;
        # 장시간 작업은 재시도하면 중복 수집이 되므로 이 경로만 재시도를 끈다.
        proxy_next_upstream off;
    }

    # 백엔드 API 프록시 (일반 제한)
    location /api/ {
        limit_req zone=global_general burst=20 nodelay;
        proxy_pass http://ott_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 주의: /oauth2/success, /oauth2/failure 는 프론트 라우팅이므로 기본 location / 으로 처리

    # OAuth2 콜백 프록시 (Spring Security 기본 콜백 경로)
    location /login/oauth2/ {
        proxy_pass http://ott_backend/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

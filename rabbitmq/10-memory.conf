# [SECURITY 2026-07-31] RabbitMQ 메모리 워터마크를 컨테이너 상한에 맞춘다.
#
# 왜 필요한가:
#   RabbitMQ 는 메모리 사용이 워터마크를 넘으면 publisher 를 막아(flow control) 스스로를
#   보호한다. 그 기준을 기본값 "보이는 메모리의 40%" 로 잡는데, 이 브로커는 cgroup 상한을
#   읽지 못하고 호스트 전체를 본다. docker-compose.prod.yml 에서 mem_limit: 1g 를 건 뒤
#   실측한 값이다:
#       컨테이너 안 /sys/fs/cgroup/memory.max = 1073741824  (1GiB, 올바름)
#       vm_memory_monitor:get_total_memory()  = 16671518720 (15.53GiB, 호스트 전체)
#       vm_memory_monitor:get_memory_limit()  = 6668607488  (6.21GiB = 그 40%)
#
#   즉 자기 보호 장치가 6.21GiB 에서 작동하도록 잡혀 있는데 커널은 1GiB 에서 죽인다.
#   그대로 두면 브로커는 publisher 를 막아 버티는 대신 OOM 으로 죽는다. 던닝 재시도 큐라
#   결제 실패 재시도가 몰릴 때가 정확히 그 상황이다.
#
# 값 근거:
#   컨테이너 상한 1GiB 의 60%. 나머지 40% 는 BEAM 자체 오버헤드와, 워터마크를 넘긴 뒤
#   flow control 이 실제로 효과를 낼 때까지의 여유로 남긴다. 상한을 바꾸면 이 값도 같이
#   바꿔야 한다 — 이 파일과 prod.yml 의 mem_limit 은 한 쌍이다.
#
# 주의: RabbitMQ 는 conf.d 를 기동 시 한 번만 읽는다. 그리고 컴포즈는 마운트된 파일의 "내용"
#   변경을 감지하지 못해 컨테이너를 다시 만들지 않는다(nginx.prod.conf 와 같은 함정).
#   이 파일의 값을 고쳤다면 재배포만으로는 반영되지 않으므로 아래 확인을 반드시 거칠 것.
#
# 확인: 이제 배포 때 자동으로 한다. security/check-container-hardening.ps1 이 이 파일의
#   값을 파싱해 브로커 실측값과 대조하고, 어긋나면 배포를 세운다. 손으로 볼 때는:
#   docker exec ott-rabbitmq rabbitmqctl -q eval \
#     'io:format("~p~n",[vm_memory_monitor:get_memory_limit()]).'
#   → 629145600 (600MiB) 이 나와야 한다. 16671518720 의 40% 인 6668607488 이 나오면 미적용.
#
# 어긋났을 때: 재기동이 필요하다고 생각하기 쉬운데 아니다. 워터마크는 런타임에 바꿀 수 있다.
#   docker exec ott-rabbitmq rabbitmqctl set_vm_memory_high_watermark absolute 600MiB
#   이걸로 무중단 교정이 되지만 메모리에만 남으므로(conf.d 를 다시 읽는 것이 아니다) 다음
#   재기동에 이 파일 값으로 돌아간다. 즉 위 명령은 응급 조치이고, 영구 반영은 다음 유지보수
#   창에서 컨테이너를 재생성해야 끝난다. 롤링 배포 중에 브로커를 재기동하지 않으려고
#   이 순서(먼저 런타임 교정 → 나중에 재생성)로 둔다.
vm_memory_high_watermark.absolute = 600MiB

# Prometheus 경보 규칙 — 기준선이 필요 없는 "절대값" 경보만 둔다.
#
# 왜 이것들뿐인가:
#   경보 기준값은 정상 운영 구간을 관측해 얻은 기준선 위에서 정해야 한다. 이 스택은
#   아직 그 관측 데이터가 없다. 지금 오류율·지연에 임의의 숫자를 박으면 오탐이 반복되고,
#   반복되는 오탐은 결국 경보를 무시하게 만든다(= 없느니만 못하다).
#   그래서 "정상값이 관측이 아니라 정의로 고정되는" 것만 여기 둔다:
#     - DLQ 유입: 정상은 0 건이다. 기준선이 필요 없다.
#     - 디스크 사용률: 기준이 트래픽이 아니라 100% 라는 물리적 상한이다.
#     - 정기결제 배치 정체: 정상 주기가 cron(6h)으로 정의돼 있다.
#   미룬 경보(오류율·지연·인증 실패 급증·배포 실패)와 거는 시점은
#   docs/operations.md 의 "경보" 절에 적어뒀다.
#
# 알아둘 것 — 이 규칙들은 아직 아무에게도 발송되지 않는다:
#   이 스택에는 Alertmanager 가 없다. firing 되어도 Prometheus 의 /alerts 화면과
#   Grafana(Alerting > Alert rules, 데이터소스 관리 규칙)에만 뜬다. 전달 경로는
#   docs/operations.md 의 "경보" 절에 남긴 후속 과제다.

groups:
  - name: ott-absolute-thresholds
    # 15초 스크레이프이므로 평가 주기는 global.evaluation_interval(15s)을 따른다.
    rules:
      # --- DLQ ----------------------------------------------------------------
      # 무엇을 보는가: 크기가 아니라 "유입"이다.
      #   브로커측 큐 깊이를 주는 익스포터가 이 스택에 없다(Prometheus 는 백엔드
      #   actuator 만 긁고, Kafka 는 JMX 익스포터가 없다). 대신 백엔드가 내보내는
      #   프로듀서 클라이언트 지표에 topic 라벨이 있어서, DLT 토픽으로 발행된
      #   레코드 수를 셀 수 있다. DLT 에는 소비자가 없으므로(KafkaConfig 참고)
      #   한 번 들어간 메시지는 스스로 사라지지 않는다 → 유입 > 0 이면 적재 > 0 이다.
      #
      # 창을 24시간으로 잡은 이유: 발송 경로가 없어 사람이 화면을 볼 때까지 떠 있어야
      #   한다. 짧은 창으로 두면 아무도 못 본 채 알아서 해소된다.
      #   한계: 배포로 컨테이너가 교체되면 옛 시계열이 끊겨 경보도 함께 사라진다.
      #   (그 시점 이후의 적재량은 화면에서 사라져도 DLT 에 그대로 남아 있다)
      - alert: KafkaDlqInflow
        expr: 'sum by (topic) (increase(kafka_producer_topic_record_send_total{topic=~".+\\.DLT"}[24h])) > 0'
        labels:
          severity: critical
        annotations:
          summary: 'DLQ 유입 — {{ $labels.topic }}'
          description: '최근 24시간 동안 {{ $value | printf "%.0f" }}건이 DLT 로 넘어갔다. 소비자가 재시도(1초 × 3회)를 소진하고 포기한 메시지다. DLT 에는 소비자가 없어 자동 복구되지 않는다 — 원인을 고친 뒤 수동으로 재처리해야 한다.'

      # --- 디스크 -------------------------------------------------------------
      # 무엇을 보는가: 백엔드 컨테이너가 보는 파일시스템(disk_total_bytes 의 path 라벨)이다.
      #   도커 볼륨(postgres/loki/prometheus 데이터)과 컨테이너 쓰기 레이어가 전부
      #   같은 파일시스템에 있으므로 "도커 데이터가 차오르는 것"은 여기서 보인다.
      #
      # 보이지 않는 것(중요): 호스트 C: 드라이브의 여유다. Docker Desktop(WSL2)에서
      #   컨테이너의 df 는 ext4 vhdx 의 "최대 크기"를 총량으로 보고한다. 실측(2026-08-06):
      #     컨테이너 기준  1007GiB 중 16% 사용
      #     호스트 C:      930GB 중 80% 사용(여유 185GB)
      #   즉 호스트가 먼저 차면 vhdx 가 더 못 자라 쓰기가 실패하는데, 이 지표는 여전히
      #   "여유 있음"으로 보인다. 호스트 디스크 감시는 이 파일로 대체되지 않는다 —
      #   후속 과제로 docs/operations.md 에 적어뒀다.
      #
      # 인스턴스가 둘(ott-app / ott-app-2)이지만 같은 파일시스템을 보므로 max 로 접어
      # 경보가 두 번 뜨지 않게 한다.
      - alert: DiskSpaceLow
        expr: 'max by (path) (1 - disk_free_bytes / disk_total_bytes) > 0.85'
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '디스크 사용률 85% 초과 — {{ $labels.path }}'
          description: '컨테이너 파일시스템 사용률 {{ $value | humanizePercentage }}. 도커 볼륨(postgres/loki/prometheus)과 이미지 캐시를 먼저 확인한다.'

      - alert: DiskSpaceCritical
        expr: 'max by (path) (1 - disk_free_bytes / disk_total_bytes) > 0.95'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: '디스크 사용률 95% 초과 — {{ $labels.path }}'
          description: '컨테이너 파일시스템 사용률 {{ $value | humanizePercentage }}. 이 선을 넘으면 postgres 쓰기와 Loki 인제스트가 곧 실패한다.'

      # --- 정기결제 배치 -------------------------------------------------------
      # 왜 이것도 "절대값" 인가: 정상 주기가 관측이 아니라 cron 으로 정의돼 있다.
      #   RecurringBillingService 는 6시간 고정 주기(0 0 */6 * * *)로 돈다. 그러니 "8시간 넘게
      #   완주 기록이 없다" 는 기준선 없이 비정상이라고 단정할 수 있다. 한 번 거른 것까지는
      #   봐주고 두 번째부터 잡는 값이다.
      #
      # 원인 지표가 아니라 증상인가(PLATFORM 9): 증상이 맞다. 배치가 멈추면 자동 청구와 던닝이
      #   멈추는데, 이 기능에는 사용자 요청이 없어서 오류율·지연으로는 잡히지 않는다. 가용성을
      #   측정할 수 있는 유일한 지점이 "돌았는가" 다.
      #
      # 무엇을 보는가: 시도가 아니라 완주다. 지표는 배치가 순회를 끝까지 돌았을 때만 갱신된다.
      #   중간에 예외가 나면 값이 그대로 늙으므로, "죽었다" 와 "아예 안 돈다" 가 같은 신호로 잡힌다.
      #   이 구분이 필요 없는 이유는 결과가 같아서다 — 어느 쪽이든 청구가 멈춘다.
      #
      # 이 규칙 하나로는 부족한 이유: 배치는 구독 한 건이 터져도 나머지를 계속 청구한다(한 사람의
      #   이상한 데이터가 전체 매출을 막지 않게 하려고 그렇게 만들었다). 그래서 전원이 실패해도
      #   완주는 완주다 — 아래 BillingItemsFailing 과 반드시 짝으로 본다. 이 규칙은 배치가
      #   "돌았는가", 아래 규칙은 "제대로 됐는가" 를 본다.
      #
      # 이게 없을 때 어떻게 되는가(왜 굳이 다는가): 배치는 사람이 트리거하지 않는 유일한 매출 경로다.
      #   실패해도 화면에 아무 변화가 없고 사용자도 모른다(청구가 안 되면 오히려 조용하다).
      #   로그에 ERROR 한 줄이 남지만 그건 누군가 그 시간에 로그를 보고 있어야만 발견된다.
      #
      # max 로 접는 이유: ShedLock 때문에 매 주기마다 두 인스턴스 중 하나만 실제로 돈다.
      #   인스턴스별로 보면 돌지 않은 쪽이 항상 늙어 있어 영구 오탐이 된다. 둘 중 최신값만 본다.
      #
      # 보이지 않는 것: 두 인스턴스가 모두 내려가면 시계열 자체가 사라져 이 식은 아무것도 반환하지
      #   않는다(= 경보도 안 뜬다). 그 경우는 이 규칙이 아니라 up 기반 감시가 잡아야 하는데
      #   이 스택에는 아직 없다 — docs/operations.md 의 후속 과제에 함께 적어둔다.
      - alert: BillingBatchStalled
        expr: 'time() - max(billing_batch_last_success_timestamp_seconds) > 28800'
        labels:
          severity: critical
        annotations:
          summary: '정기결제 배치 8시간 이상 완주 기록 없음'
          description: '마지막 완주로부터 {{ $value | humanizeDuration }} 경과(정상 주기 6시간). 배치가 예외로 죽었거나 스케줄러/ShedLock 이 발화하지 않고 있다. 자동 청구와 던닝 재시도가 그동안 멈춰 있다 — 백엔드 로그에서 "정기결제 배치 시작" 이후 스택트레이스를 확인한다.'

      # 왜 0 이 기준인가: 여기서 세는 것은 카드 거절이 아니다. 거절은 던닝이 처리하는 정상 결과라
      #   이 값에 잡히지 않는다. 잡히는 것은 청구 절차 자체가 예외로 끝난 건 — 코드 결함, 데이터
      #   이상, PG 연동 오류다. 정상값이 정의상 0 이므로 기준선이 필요 없다.
      #
      # for 를 6시간 넘게 두는 이유: 배치가 6시간마다 한 번만 이 값을 쓴다. 그보다 짧게 잡으면
      #   다음 주기가 값을 덮기도 전에 뜨는 게 아니라, 한 주기의 우발적 실패까지 전부 호출한다.
      #   한 주기는 봐주고 두 주기 연속 실패부터 잡는다(BillingBatchStalled 의 8시간과 같은 사고방식).
      #
      # severity 가 warning 인 이유: 청구가 전부 멈춘 게 아니라 일부가 밀린 상태다. 밀린 건은
      #   다음 주기에 다시 대상이 되므로 즉시 대응이 아니라 그날 안에 원인을 보면 된다.
      #   전면 중단은 위 critical 이 잡는다.
      - alert: BillingItemsFailing
        expr: 'max(billing_batch_failed_items) > 0'
        for: 7h
        labels:
          severity: warning
        annotations:
          summary: '정기결제 배치에서 청구 실패 구독 발생 — {{ $value }}건'
          description: '마지막 배치에서 {{ $value }}개 구독의 청구가 예외로 끝났다(카드 거절은 여기 포함되지 않는다). 배치 자체는 완주했으므로 나머지 구독은 정상 청구됐다 — 백엔드 로그에서 "구독 청구 실패" 로 subscriptionId 와 스택트레이스를 확인한다.'


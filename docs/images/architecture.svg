<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .hl { stroke: #2563EB; stroke-width: 2; }
      .group { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .ext { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .main { font-size: 18px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .sub { font-size: 13px; fill: #64748B; text-anchor: middle; }
      .label { font-size: 13px; fill: #64748B; }
      .line { fill: none; stroke: #64748B; stroke-width: 1.6; }
      .badge { fill: #2563EB; }
      .num { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- 뱃지 번호는 README "핵심 설계" 절 번호 -->
  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- Browser -> nginx -> app -->
  <rect class="box" x="24" y="152" width="120" height="64" rx="8"/>
  <text class="main" x="84" y="190">Browser</text>

  <rect class="box" x="184" y="152" width="140" height="64" rx="8"/>
  <text class="main" x="254" y="180">nginx</text>
  <text class="sub" x="254" y="202">로드밸런싱</text>

  <rect class="box" x="386" y="120" width="190" height="112" rx="8"/>
  <rect class="box hl" x="378" y="128" width="190" height="112" rx="8"/>
  <text class="main" x="473" y="170">Spring Boot ×2</text>
  <text class="sub" x="473" y="196">ShedLock 분산락</text>
  <text class="sub" x="473" y="216">순차 교체 무중단 배포</text>

  <rect class="box" x="184" y="290" width="140" height="64" rx="8"/>
  <text class="main" x="254" y="318">Next.js</text>
  <text class="sub" x="254" y="340">App Router</text>

  <path class="line" d="M144,184 H182" marker-end="url(#a)"/>
  <path class="line" d="M324,184 H376" marker-end="url(#a)"/>
  <text class="label" x="332" y="176">/api</text>
  <path class="line" d="M254,216 V288" marker-end="url(#a)"/>
  <text class="label" x="262" y="256">/</text>

  <!-- 내부망 데이터 계층 -->
  <rect class="group" x="612" y="12" width="332" height="306" rx="10"/>
  <text class="label" x="628" y="36">내부망 · app만 접근</text>

  <rect class="box" x="636" y="52" width="288" height="56" rx="8"/>
  <text class="main" x="780" y="75">PostgreSQL</text>
  <text class="sub" x="780" y="96">Flyway expand/contract</text>

  <rect class="box hl" x="636" y="118" width="288" height="56" rx="8"/>
  <text class="main" x="780" y="141">Redis</text>
  <text class="sub" x="780" y="162">세션 공유 · 진행률 write-back</text>
  <circle class="badge" cx="924" cy="118" r="12"/><text class="num" x="924" y="118">7</text>

  <rect class="box hl" x="636" y="184" width="288" height="56" rx="8"/>
  <text class="main" x="780" y="207">Kafka</text>
  <text class="sub" x="780" y="228">트랜잭셔널 아웃박스</text>
  <circle class="badge" cx="924" cy="184" r="12"/><text class="num" x="924" y="184">2</text>

  <rect class="box" x="636" y="250" width="288" height="56" rx="8"/>
  <text class="main" x="780" y="273">RabbitMQ</text>
  <text class="sub" x="780" y="294">결제 재청구 (TTL + DLX)</text>

  <path class="line" d="M576,184 H596 M596,80 V278"/>
  <path class="line" d="M596,80 H634" marker-end="url(#a)"/>
  <path class="line" d="M596,146 H634" marker-end="url(#a)"/>
  <path class="line" d="M596,212 H634" marker-end="url(#a)"/>
  <path class="line" d="M596,278 H634" marker-end="url(#a)"/>

  <!-- 아웃바운드 -->
  <rect class="box hl" x="636" y="340" width="288" height="56" rx="8"/>
  <text class="main" x="780" y="363">squid 프록시</text>
  <text class="sub" x="780" y="384">아웃바운드 허용목록</text>
  <circle class="badge" cx="924" cy="340" r="12"/><text class="num" x="924" y="340">8</text>

  <rect class="ext" x="636" y="428" width="288" height="48" rx="8"/>
  <text class="sub" x="780" y="457">외부 API · OAuth · 결제 · TMDB</text>

  <path class="line" d="M473,240 V368 H634" marker-end="url(#a)"/>
  <path class="line" d="M780,396 V426" marker-end="url(#a)"/>

  <!-- 영상 재생 경로 -->
  <rect class="box hl" x="184" y="410" width="200" height="64" rx="8"/>
  <text class="main" x="284" y="438">Cloudflare Worker</text>
  <text class="sub" x="284" y="460">서명 · 만료 검증</text>
  <circle class="badge" cx="384" cy="410" r="12"/><text class="num" x="384" y="410">4</text>

  <rect class="box" x="424" y="410" width="160" height="64" rx="8"/>
  <text class="main" x="504" y="438">R2</text>
  <text class="sub" x="504" y="460">비공개 · HLS</text>

  <path class="line" d="M84,216 V442 H182" marker-end="url(#a)"/>
  <text class="label" x="94" y="330">영상 재생</text>
  <path class="line" d="M384,442 H422" marker-end="url(#a)"/>

  <!-- CI/CD -->
  <rect class="group" x="24" y="500" width="920" height="84" rx="10"/>
  <text class="main" x="72" y="548">CI/CD</text>

  <rect class="box" x="120" y="518" width="170" height="48" rx="8"/>
  <text class="main" x="205" y="548" style="font-size:15px">GitHub Actions</text>

  <rect class="box" x="330" y="518" width="260" height="48" rx="8"/>
  <text class="main" x="460" y="548" style="font-size:15px">테스트 · 시크릿 · Trivy 게이트</text>

  <rect class="box" x="630" y="518" width="110" height="48" rx="8"/>
  <text class="main" x="685" y="548" style="font-size:15px">GHCR</text>

  <rect class="box" x="780" y="518" width="140" height="48" rx="8"/>
  <text class="main" x="850" y="548" style="font-size:15px">서버 배포</text>

  <path class="line" d="M290,542 H328" marker-end="url(#a)"/>
  <path class="line" d="M590,542 H628" marker-end="url(#a)"/>
  <path class="line" d="M740,542 H778" marker-end="url(#a)"/>
</svg>
